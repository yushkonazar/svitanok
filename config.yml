timezone: Europe/Kyiv

# БОЙОВЕ вікно: [8, 12) = 08:00–11:59 Київ (верх невключний). Cron 05:00+06:00 UTC:
# літо 08:00/09:00 Київ (шле о 08:00, друге — ідемпотентний скіп); зима 07:00/08:00
# (07:00 скіп до вікна, 08:00 шле). Тобто о 08:00 Київ цілорічно.
sendHour: 8
sendWindowHours: 4

locations:
  - { lat: 49.8397, lon: 24.0297, name: 'Львів' }
  - { lat: 51.1200, lon: 26.4600, name: 'Немовичі' } # ⚠️ звірити координати перед бойовим

quietDay:
  triggerOn: ['news', 'calendar']

modules:
  stoic: { enabled: true }
  weather: { enabled: true }
  calendar: { enabled: true } # у повідомленні; активний коли є GOOGLE_* секрети
  news:
    enabled: true
    perTopic: 3 # заголовків на тему (масштабується вагами 👍/👎)
    dedupDays: 3
    retentionDays: 7
    # NewsData.io (ключ NEWSDATA_API_KEY): теми = scope × category. Датацентр-
    # дружній API (знімає 403 на .ua).
    #
    # Редизайн новин (фідбек власника): region = СТРОГО за походженням джерела,
    # не за темою. «Україна» — лише українські джерела (NewsData country=ua,
    # ТСН, BBC Україна). «Світ» — світові джерела + УСЕ позарегіональне, чого
    # немає сенсу дублювати в обидва боки (Кіберспорт/Футбол/Релізи — тем без
    # країни, «Краще просто занести Релізи в Світ, адже це загальносвітова
    # тема»). NewsData free-тариф має 12-годинну затримку й не дає обрати
    # видання (лише категорія/мова) — тому «Світ»/«Наука»/«Тех/IT»/«Футбол»
    # тепер СПРАВЖНІ RSS перевірених видань (BBC/Guardian/ТСН), у реальному
    # часі, а не через агрегатор.
    #
    # Кілька рядків можуть свідомо ділити одну (scope, topic) пару — вони
    # МЕРДЖАТЬСЯ в одну групу (news.ts, createNewsModule). Декларуємо рядки
    # однієї теми ПОРЯД (сортування за вагою стабільне — порядок мерджу
    # передбачуваний лише тоді).
    #
    #  🇺🇦 Україна: country=ua + language=uk — новини про/з України.
    #  🌍 Світ: language=en БЕЗ country (C1, рішення власника) — раніше world
    #     фільтрувався лише language=uk, тож туди текли укр-видання про укр-події
    #     (дублюючи рубрику «Україна»). Англомовний world = справді міжнародний.
    # ⚠️ Кожна тема живе лише в ОДНОМУ scope. Ваги/інтереси/голоси ключаться по
    # display-імені теми, тож однакова назва у двох scope мовчки ділила б один
    # бал — «Тех/IT» (світ) і «Технології» (Україна) свідомо розведені назвами.
    topics:
      # 🇺🇦 Українські — лише українські джерела.
      - { scope: ua, topic: Головне, category: top, country: ua, language: uk }
      - { scope: ua, topic: Політика, category: politics, country: ua, language: uk }
      - {
          scope: ua,
          topic: Політика,
          source: rss,
          url: 'https://tsn.ua/rss/politika',
          language: uk,
        }
      # Оборони/фронту в переліку категорій NewsData НЕМА — тому пошук за словами.
      - {
          scope: ua,
          topic: Оборона,
          q: 'війна OR оборона OR фронт OR ЗСУ',
          country: ua,
          language: uk,
        }
      - { scope: ua, topic: Економіка, category: business, country: ua, language: uk }
      - { scope: ua, topic: Економіка, source: rss, url: 'https://tsn.ua/rss/groshi', language: uk }
      - { scope: ua, topic: Спорт, category: sports, country: ua, language: uk }
      - { scope: ua, topic: Технології, category: technology, country: ua, language: uk }
      - {
          scope: ua,
          topic: Технології,
          source: rss,
          url: 'https://tsn.ua/rss/nauka_it',
          language: uk,
        }
      - { scope: ua, topic: Технології, source: rss, url: 'https://itc.ua/feed/', language: uk }
      - { scope: ua, topic: Суспільство, category: domestic, country: ua, language: uk }
      - { scope: ua, topic: Освіта, category: education, country: ua, language: uk }
      # «Загальне» — злиття BBC Україна (мовна стрічка) + ТСН, розділ «Україна»
      # (ДУЖЕ свіжий — перевірено, 2-5 хв між новинами). Окремо від «Головне»
      # (те — NewsData category=top). Свідомо `/rss/ukrayina`, НЕ загальний
      # `/rss`: загальний фід інколи мішає й російськомовні матеріали (ТСН
      # веде паралельну ru-версію сайту) — розділ `/ukrayina` підтверджено
      # тегований `<language>uk-ukr</language>` і містить лише українську.
      - {
          scope: ua,
          topic: Загальне,
          source: rss,
          url: 'https://feeds.bbci.co.uk/ukrainian/rss.xml',
          language: uk,
        }
      - {
          scope: ua,
          topic: Загальне,
          source: rss,
          url: 'https://tsn.ua/rss/ukrayina',
          language: uk,
        }

      # 🌍 Світові — світові джерела + все позарегіональне (Кіберспорт/Футбол/
      # Релізи не мають країни, тож живуть тут, а не дублюються в Україну).
      # «Бізнес» тут і «Економіка» вище — та сама категорія NewsData, але різні
      # scope Й РІЗНІ назви: спільна назва мовчки злила б їхні ваги в один бал.
      #
      # «Світ» — заміна NewsData category=world (12г затримка, без контролю
      # видання) на прямі RSS BBC World + Guardian World.
      #
      # translate: true — Google Cloud Translation (title+why -> uk), лише на
      # прозових джерелах нижче (BBC/Guardian/NewsData-категорії). НЕ на HN
      # (терсі заголовки посилань), Кіберспорт/Релізи (власні назви команд/
      # турнірів/тегів — переклад або нема що робити, або сплутає назву).
      - {
          scope: world,
          topic: Світ,
          source: rss,
          url: 'https://feeds.bbci.co.uk/news/world/rss.xml',
          language: en,
          translate: true,
        }
      - {
          scope: world,
          topic: Світ,
          source: rss,
          url: 'https://www.theguardian.com/world/rss',
          language: en,
          translate: true,
        }

      - { scope: world, topic: Наука, category: science, language: en, translate: true }
      - {
          scope: world,
          topic: Наука,
          source: rss,
          url: 'https://feeds.bbci.co.uk/news/science_and_environment/rss.xml',
          language: en,
          translate: true,
        }
      - {
          scope: world,
          topic: Наука,
          source: rss,
          url: 'https://www.theguardian.com/science/rss',
          language: en,
          translate: true,
        }

      - { scope: world, topic: Здоровʼя, category: health, language: en, translate: true }
      - { scope: world, topic: Культура, category: entertainment, language: en, translate: true }
      - { scope: world, topic: Бізнес, category: business, language: en, translate: true }
      - { scope: world, topic: Довкілля, category: environment, language: en, translate: true }

      # «Тех/IT» — злиття NewsData technology + Hacker News (той самий смисл,
      # що раніше окремий чіп, тепер частина цієї теми) + BBC/Guardian Technology.
      # HN свідомо БЕЗ translate: terse заголовки посилань (продукти/репо),
      # не прозовий текст — переклад там частіше плутає, ніж допомагає.
      - { scope: world, topic: Тех/IT, category: technology, language: en, translate: true }
      - {
          scope: world,
          topic: Тех/IT,
          source: rss,
          url: 'https://hnrss.org/frontpage',
          language: en,
        }
      - {
          scope: world,
          topic: Тех/IT,
          source: rss,
          url: 'https://feeds.bbci.co.uk/news/technology/rss.xml',
          language: en,
          translate: true,
        }
      - {
          scope: world,
          topic: Тех/IT,
          source: rss,
          url: 'https://www.theguardian.com/uk/technology/rss',
          language: en,
          translate: true,
        }

      # «Кіберспорт» — обидва джерела (власник: «Беремо і те, і те»), фокус на
      # CS2 (власник: «основна гра про яку я б хотів отримувати новини»).
      # HLTV: попередній висновок «TLS/HTTP-фінгерпринт-рівня захист (JA3/JA4)»
      # ⚠️ ПОМИЛКОВИЙ — перевірено НАПРЯМУ (04.08.2026, curl + Node fetch, той
      # самий запит): 403 дає САМЕ Chrome-«браузерний» User-Agent, і curl, і
      # Node fetch з ним ОБИДВА блокуються (не лише Node). Без UA або з чесним
      # ботовим UA — 200 в ОБОХ клієнтів. Тобто Cloudflare тут ріже за
      # UA-стрінгом, що видає себе за браузер з датацентр-IP, а не за
      # TLS-фінгерпринтом. Фікс: чесний UA нижче замість Chrome-маскування.
      # Про запас лишається curl-фолбек у news.ts (curlFetch, на 403 для
      # rss-джерел) — генерична страховка на майбутнє для БУДЬ-ЯКОГО іншого
      # джерела, яке колись так само заблокує bot-захист.
      #
      # dotesports.com/feed — це esports ЗАГАЛОМ (LoL, Valorant, CS2, Dota
      # тощо впереміш) — includePattern звужує до CS2/Counter-Strike. HLTV —
      # без фільтра, сайт і так виключно про CS (CS2/CS:GO), звужувати нема що.
      - {
          scope: world,
          topic: Кіберспорт,
          source: rss,
          url: 'https://dotesports.com/feed',
          language: en,
          includePattern: 'CS2|CS:?GO|Counter-?Strike',
        }
      - {
          scope: world,
          topic: Кіберспорт,
          source: rss,
          url: 'https://www.hltv.org/rss/news',
          language: en,
          headers: { User-Agent: 'SvitanokNewsBot/1.0 (+https://github.com/yushkonazar/svitanok)' },
        }

      - {
          scope: world,
          topic: Футбол,
          source: rss,
          url: 'https://feeds.bbci.co.uk/sport/football/rss.xml',
          language: en,
          translate: true,
        }
      - {
          scope: world,
          topic: Футбол,
          source: rss,
          url: 'https://www.theguardian.com/football/rss',
          language: en,
          translate: true,
        }

      # «Релізи» — розширений список репозиторіїв (замінює колишні окремі
      # «Релізи React»/«Релізи Node» — тепер один топік, «9 репо»). Vite й
      # Cloudflare Workers SDK — монорепо (releases.atom мішає core-теги із
      # саб-пакетами, напр. plugin-legacy@8.2.2/wrangler@4.114.0) — includePattern
      # звужує до «свого». PostgreSQL тегує й beta/rc (REL_19_BETA2) — excludePattern.
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/facebook/react/releases.atom',
          language: en,
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/nodejs/node/releases.atom',
          language: en,
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/microsoft/TypeScript/releases.atom',
          language: en,
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/microsoft/vscode/releases.atom',
          language: en,
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/git/git/releases.atom',
          language: en,
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/tailwindlabs/tailwindcss/releases.atom',
          language: en,
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/postgres/postgres/releases.atom',
          language: en,
          excludePattern: '(beta|rc|alpha)',
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/vitejs/vite/releases.atom',
          language: en,
          includePattern: '^v?\d+\.\d+\.\d+$',
        }
      - {
          scope: world,
          topic: Релізи,
          source: rss,
          url: 'https://github.com/cloudflare/workers-sdk/releases.atom',
          language: en,
          includePattern: '^wrangler@',
        }
  weeklyReview: { enabled: true, day: 'sunday' }
  fact:
    enabled: true
    batchSize: 15 # один виклик генерує 15 фактів (~38с) -> ~1 виклик на 2 тижні
  mock:
    enabled: true
    batchSize: 15 # питання співбесіди, батч-кеш (як fact)
    profile: 'Junior/Trainee Full Stack: JavaScript/TypeScript, React, Node.js, HTTP, SQL'
  currency: { enabled: true } # курс НБУ, лише дашборд
  onthisday: { enabled: true } # «у цей день» (Wikipedia), лише дашборд
  mail:
    enabled: true # Gmail OAuth ре-консент (gmail.readonly) завершено, Блок P2c
    dedupDays: 3
    maxCandidates: 15
    query: 'in:inbox newer_than:3d -category:promotions -category:social'
  jobs:
    enabled: true
    # 3 -> 7 (фідбек власника: щодня приходило не більше 3, замало). POOL_SIZE
    # (src/modules/jobs.ts) піднято паралельно, щоб на скоринг ішло достатньо
    # кандидатів під новий perRun.
    perRun: 7
    dedupDays: 7
    # Профіль для LLM-скорингу релевантності вакансій (fit %).
    profile: >-
      Full Stack веброзробник (Frontend + Backend), рівень Trainee/Junior.
      Стек: JavaScript/TypeScript, React, Node.js, HTML/CSS.
      Цікавлять junior-дружні вакансії під цей стек.
    # DOU (junior exp 0-1) + Djinni (no_exp/1y) — RSS, датацентр-дружні.
    # Work.ua ПІДТВЕРДЖЕНО віддає 403 раннеру GitHub Actions (перевірено в CI
    # 2026-07-05) — код parseWorkUa лишається готовим для проксі/self-hosted
    # раннера, але джерела вимкнено, щоб не було щоденних warn без користі:
    #   - 'https://www.work.ua/jobs-junior+developer/'
    #   - 'https://www.work.ua/jobs-junior+full+stack/'
    # 4 DOU + 4 Djinni (було 3 DOU) — collectPool (jobs.ts) бере round-robin по
    # СПИСКАХ, тож меншість джерел структурно недоотримувала слоти ще ДО
    # скорингу (3 DOU vs 4 Djinni -> 6/14 vs 8/14 у старому пулі). Четвертий
    # DOU-фід — ширший exp-діапазон на тій самій категорії (не замінює
    # junior-фіди нижче, додає паралельний, трохи ширший зріз).
    sources:
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Full%20Stack&exp=0-1'
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Front%20End&exp=0-1'
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Back%20End&exp=0-1'
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Full%20Stack&exp=1-3'
      - 'https://djinni.co/jobs/rss/?primary_keyword=Fullstack&exp_level=no_exp&exp_level=1y'
      - 'https://djinni.co/jobs/rss/?primary_keyword=JavaScript&exp_level=no_exp&exp_level=1y'
      - 'https://djinni.co/jobs/rss/?primary_keyword=Node.js&exp_level=no_exp&exp_level=1y'
      - 'https://djinni.co/jobs/rss/?primary_keyword=React.js&exp_level=no_exp&exp_level=1y'

llm:
  # Haiku для курації: Opus/Sonnet через extended thinking зависали на claude -p
  # (>120с таймаут), Haiku завершує надійно. Латентність claude -p різко росте з
  # розміром промпта, тож тримаємо мало кандидатів (MAX_ITEMS_PER_FEED). Звірено (§0).
  model: 'claude-haiku-4-5'
  maxCallsPerRun: 5 # jobs-скоринг + mail-тріаж (1/день кожен) + fact/mock (батч-кеш, зрідка) + запас
  timeoutMs: 150000 # запас під latency claude -p у CI

fetch:
  timeoutMs: 30000
  retries: 2

telegram:
  maxMessageChars: 3900 # запас під ліміт 4096
