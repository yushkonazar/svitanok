timezone: Europe/Kyiv

# БОЙОВЕ вікно: [8, 12) = 08:00–11:59 Київ (верх невключний). Cron 05:00+06:00 UTC:
# літо 08:00/09:00 Київ (шле о 08:00, друге — ідемпотентний скіп); зима 07:00/08:00
# (07:00 скіп до вікна, 08:00 шле). Тобто о 08:00 Київ цілорічно.
sendHour: 8
sendWindowHours: 4

locations:
  - { lat: 49.8397, lon: 24.0297, name: 'Львів' }
  - { lat: 51.1200, lon: 26.4600, name: 'Немовичі' } # ⚠️ звірити координати перед бойовим

quietDay:
  triggerOn: ['news', 'calendar']

modules:
  stoic: { enabled: true }
  weather: { enabled: true }
  calendar: { enabled: false } # увімкнути після Google OAuth (Production)
  news:
    enabled: true
    categories: ['Україна та світ', 'Технології / IT', 'Спорт', 'Наука / економіка']
    perCategory: 2
    dedupDays: 3
    retentionDays: 7
    # Джерела мають віддаватись із датацентрових IP GitHub Actions. Більшість
    # .ua-сайтів за Cloudflare віддають 403 раннеру, тож для покриття — Google News
    # (датацентр-дружній); BBC та itc.ua підтверджено працюють у CI.
    sources:
      'Україна та світ':
        - 'https://feeds.bbci.co.uk/ukrainian/rss.xml'
        - 'https://news.google.com/rss?hl=uk&gl=UA&ceid=UA:uk'
      'Технології / IT':
        - 'https://itc.ua/feed/'
        - 'https://news.google.com/rss/search?q=технології%20україна&hl=uk&gl=UA&ceid=UA:uk'
      'Спорт':
        - 'https://news.google.com/rss/search?q=спорт%20україна&hl=uk&gl=UA&ceid=UA:uk'
      'Наука / економіка':
        - 'https://news.google.com/rss/search?q=економіка%20україна&hl=uk&gl=UA&ceid=UA:uk'
  nextStep:
    enabled: true
    steps:
      - 'Пофіксити OG-теги'
      - 'Mock-питання з KB'
      - 'Оновити резюме під вакансію'
  weeklyReview: { enabled: true, day: 'sunday' }
  fact:
    enabled: true
    batchSize: 15 # один виклик генерує 15 фактів (~38с) -> ~1 виклик на 2 тижні
  mock:
    enabled: true
    batchSize: 15 # питання співбесіди, батч-кеш (як fact)
    profile: 'Junior/Trainee Full Stack: JavaScript/TypeScript, React, Node.js, HTTP, SQL'
  currency: { enabled: true } # курс НБУ, лише дашборд
  onthisday: { enabled: true } # «у цей день» (Wikipedia), лише дашборд
  jobs:
    enabled: true
    perRun: 3
    dedupDays: 7
    # Профіль для LLM-скорингу релевантності вакансій (fit %).
    profile: >-
      Full Stack веброзробник (Frontend + Backend), рівень Trainee/Junior.
      Стек: JavaScript/TypeScript, React, Node.js, HTML/CSS.
      Цікавлять junior-дружні вакансії під цей стек.
    # DOU (junior exp 0-1) + Djinni (no_exp/1y). Work.ua/robota/LinkedIn — 403 з датацентру.
    sources:
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Full%20Stack&exp=0-1'
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Front%20End&exp=0-1'
      - 'https://jobs.dou.ua/vacancies/feeds/?category=Back%20End&exp=0-1'
      - 'https://djinni.co/jobs/rss/?primary_keyword=Fullstack&exp_level=no_exp&exp_level=1y'
      - 'https://djinni.co/jobs/rss/?primary_keyword=JavaScript&exp_level=no_exp&exp_level=1y'

llm:
  # Haiku для курації: Opus/Sonnet через extended thinking зависали на claude -p
  # (>120с таймаут), Haiku завершує надійно. Латентність claude -p різко росте з
  # розміром промпта, тож тримаємо мало кандидатів (MAX_ITEMS_PER_FEED). Звірено (§0).
  model: 'claude-haiku-4-5'
  maxCallsPerRun: 4 # jobs-скоринг (1/день) + fact/mock (батч-кеш, зрідка) + запас
  timeoutMs: 150000 # запас під latency claude -p у CI

fetch:
  timeoutMs: 30000
  retries: 2

telegram:
  maxMessageChars: 3900 # запас під ліміт 4096
