<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Main app keeps third-party scripts/session isolated. Maps JS lives in an
         a separate origin with its own policy; authenticated fetch stays same-origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.bstatic.com; font-src 'self'; connect-src 'self'; frame-src 'self' https://maps.svitanok.yushko.dev; base-uri 'self'; form-action 'self'"
    />
    <title>Svitanok</title>
    <!-- Telegram WebApp SDK: initData (авторизація власника), тема, HapticFeedback.
         Єдиний зовнішній скрипт; підключається до нашого JS. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
