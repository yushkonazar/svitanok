<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- CSP (E4-final): скрипти лише свої + telegram.org (WebApp SDK); стилі свої
         + inline (React style-пропси); fetch лише свій origin
         (/api, /briefing.json); зображення свої + data:. Без 'unsafe-eval'
         (прод-бандл Vite його не потребує). frame-ancestors не задаємо через
         <meta> — щоб Telegram-вебв'ю міг вбудувати апку. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <title>Svitanok</title>
    <!-- Telegram WebApp SDK: initData (авторизація власника), тема, HapticFeedback.
         Єдиний зовнішній скрипт; підключається до нашого JS. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
