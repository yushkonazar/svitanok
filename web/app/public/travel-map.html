<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Served by the separate maps origin. Google's eval/worker requirements
         apply only to this document, which cannot access the parent session. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'unsafe-inline' https://fonts.googleapis.com; img-src data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com; connect-src https://*.googleapis.com https://*.gstatic.com https://*.google.com data: blob:; font-src https://fonts.gstatic.com; worker-src blob:; frame-src 'self' https://*.google.com; base-uri 'none'; form-action 'none'"
    />
    <title>Мапа подорожі</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        width: 100%;
        margin: 0;
      }
      body {
        background: #e7ece9;
        font: 12px system-ui;
      }
      button.pin {
        min-height: 36px;
        max-width: 180px;
        padding: 6px 9px;
        border: 1px solid #375348;
        border-radius: 12px;
        background: #fff;
        color: #1c2520;
        box-shadow: 0 3px 10px #0003;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .pin.is-active {
        background: #28634b;
        color: #fff;
      }
    </style>
    <script src="./travel-map-frame.js" defer></script>
  </head>
  <body>
    <div id="map" aria-label="Google Maps"></div>
  </body>
</html>
