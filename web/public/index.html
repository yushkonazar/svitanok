<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover — під безпечні зони iPhone (notch/home-indicator) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Svitanok</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts: Golos Text (текст) + Unbounded (wordmark/заголовки) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ══════════════════════════════════════════════════════════════════════
         ПАЛІТРА «СВІТАНОК»
         Акцент-градієнт (корал→амбер) застосовується ЗАВЖДИ, незалежно від
         Telegram-теми, щоб прибрати «сірість». База (bg/card/text) у Telegram
         синхронізується з themeParams; поза Telegram — fallback нижче.
         ══════════════════════════════════════════════════════════════════════ */
      :root {
        /* ── БАЗА (fallback поза Telegram — темна, «світанковий» нейтрал) ── */
        --bg: #10131f; /* глибокий синьо-графітовий, не сірий */
        --text: #f4f6fb;
        --muted: #9aa3b8;

        /* СКЛО: напівпрозорий fill + рамка + тінь (наші, не з теми) */
        --glass: rgba(255, 255, 255, 0.06);
        --glass-2: rgba(255, 255, 255, 0.045); /* вкладені елементи (плитки) */
        --glass-strong: rgba(255, 255, 255, 0.1); /* fallback без backdrop-filter */
        --border: rgba(255, 255, 255, 0.09);
        --border-2: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.08);
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.28);

        /* АКЦЕНТ «Світанок» — ПРИГЛУШЕНО, лише як акцент */
        --accent: #ff7a59; /* primary корал */
        --accent-2: #ffb03a; /* амбер (кінець градієнта) */
        --link: #ffc76b; /* тепле золото для дельт-нейтралі */
        --grad: linear-gradient(135deg, #ff6b57 0%, #ffb03a 100%);
        --grad-soft: linear-gradient(
          135deg,
          rgba(255, 107, 87, 0.16) 0%,
          rgba(255, 176, 58, 0.16) 100%
        );
        --on-accent: #241203; /* текст поверх градієнта (темний, читабельний і в світлій темі) */

        /* семантика */
        --good: #46e0a0;
        --warn: #ffb03a;
        --bad: #ff6b86;

        /* рецесивний «трек» під графіками (порожні бари/доріжки/клітинки) —
           одна змінна, темується разом із базою (у світлій темі білі альфи невидимі) */
        --track: rgba(255, 255, 255, 0.07);

        --radius: 16px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);

        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0 auto;
        max-width: 560px;
        /* Golos Text для тіла; фолбек — системний */
        font-family:
          'Golos Text',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--text);
        font-size: 15px;
        font-weight: 400;
        line-height: 1.5;
        padding: calc(12px + var(--safe-top)) 14px calc(48px + var(--safe-bottom));
        position: relative;
        z-index: 0;
        /* перенос довгих слів/URL — щоб нічого не вилазило */
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      /* ── ФІКСОВАНИЙ ФОН: нейтральний темний градієнт + світанковий glow згори ── */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(
            120% 62% at 78% -8%,
            rgba(255, 122, 89, 0.22) 0%,
            rgba(255, 176, 58, 0.1) 34%,
            rgba(255, 176, 58, 0) 62%
          ),
          radial-gradient(
            90% 50% at 8% 2%,
            rgba(126, 108, 255, 0.12) 0%,
            rgba(126, 108, 255, 0) 55%
          ),
          linear-gradient(180deg, #141826 0%, #0e111b 46%, #0b0e17 100%);
      }

      /* спільна «скляна» поверхня */
      .glass {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      /* fallback: без backdrop-filter — трохи щільніший fill */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .glass {
          background: var(--glass-strong);
        }
      }

      /* ── Банер свіжості (sticky, приглушене скло з тонким акцентом) ─────── */
      .freshness {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: calc(-12px - var(--safe-top)) -14px 14px;
        padding: calc(9px + var(--safe-top)) 14px 9px;
        font-size: 12.5px;
        font-weight: 500;
        text-align: center;
        color: var(--text);
        background: rgba(20, 24, 38, 0.72);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      }
      .freshness::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: middle;
        background: linear-gradient(135deg, #ff6b57, #ffb03a);
        box-shadow: 0 0 8px rgba(255, 122, 89, 0.55);
      }
      .freshness.stale {
        color: var(--warn);
      }
      .freshness.stale::before {
        background: var(--warn);
        box-shadow: none;
      }

      /* ── Хедер + навігація по датах ─────────────────────────────────────── */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      header h1 {
        font-family: 'Unbounded', 'Golos Text', system-ui, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      header h1 .wm {
        /* градієнтний wordmark */
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .datenav {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 3px;
        min-width: 0;
      }
      .datenav .when {
        color: var(--muted);
        font-size: 12.5px;
        min-width: 0;
        max-width: 108px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .datenav button {
        border: 1px solid var(--border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: var(--accent-2);
        width: 44px;
        height: 44px;
        border-radius: 12px;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      .datenav button:disabled {
        opacity: 0.3;
        cursor: default;
      }

      /* ── Таби ───────────────────────────────────────────────────────────── */
      nav {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        position: sticky;
        top: calc(40px + var(--safe-top));
        z-index: 15;
        padding: 5px;
        border-radius: 999px;
        background: rgba(18, 22, 34, 0.66);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-2);
      }
      nav button {
        flex: 1;
        min-height: 42px;
        background: transparent;
        color: var(--muted);
        border: 0;
        border-radius: 999px;
        padding: 8px 2px;
        font-family: 'Golos Text', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.15s;
      }
      nav button.active {
        background: var(--grad);
        color: var(--on-accent);
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(255, 122, 89, 0.3);
      }

      section {
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      section.active {
        display: flex;
      }

      /* ── Картки (скло) ──────────────────────────────────────────────────── */
      .card {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        padding: 15px 16px;
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .card {
          background: var(--glass-strong);
        }
      }
      .card h3 {
        margin: 0 0 11px;
        font-family: 'Unbounded', 'Golos Text', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.1px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      /* акцент лише як тонка «іскра» зліва від заголовка картки */
      .card > h3::before,
      .card-head > h3::before {
        content: '';
        flex: 0 0 auto;
        width: 3px;
        height: 15px;
        border-radius: 2px;
        background: var(--grad);
      }
      /* заголовки без «іскри» (де емодзі несе акцент) */
      .card > h3.plain::before,
      .card-head > h3.plain::before {
        display: none;
      }
      /* заголовок + кутова дія (напр. 🔖) в один рядок; відступ знизу — на
         обгортці, а не на h3 (щоб кнопка центрувалась по висоті без перекосу) */
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 11px;
      }
      .card .card-head h3 {
        margin: 0;
      }
      .card-head .item-actions {
        flex: 0 0 auto;
      }

      /* вкладені «плитки» (напр. погода) — легше скло */
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      /* повноширинні рядки (курс/погода) — колонка на всю ширину */
      .rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tile {
        background: var(--glass-2);
        border: 1px solid var(--border-2);
        border-radius: 13px;
        padding: 12px 14px;
        min-width: 0;
      }
      .tile .lbl {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .tile .big {
        font-size: 23px;
        font-weight: 600;
      }
      .tile .sub {
        color: var(--muted);
        font-size: 13px;
      }
      /* повноширинний рядок курсу: прапор+код зліва, значення справа */
      .row-lead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .row-lead .lbl {
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
      }
      .row-lead .big {
        font-size: 22px;
        font-weight: 600;
      }
      /* повноширинний рядок погоди: місто+темп зліва, стан справа */
      .wx-lead {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .wx-lead .wx-temp {
        font-size: 30px;
        font-weight: 600;
        line-height: 1;
      }
      .wx-lead .wx-city {
        font-size: 15px;
        font-weight: 500;
      }
      .wx-lead .wx-cond {
        margin-left: auto;
        text-align: right;
        color: var(--muted);
        font-size: 13px;
      }
      /* ── Розкритий віджет погоди (дизайн Погода.dc.html) ─────────────── */
      .wxc {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .wxc-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .wxc-place {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      .wxc-emoji {
        font-size: 32px;
        line-height: 1;
      }
      .wxc-city {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .wxc-cond {
        font-size: 13px;
        color: var(--muted);
        margin-top: 1px;
      }
      .wxc-daypill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--grad-soft);
        color: var(--accent-2);
        font-size: 12.5px;
        font-weight: 700;
        border-radius: 999px;
        padding: 7px 13px;
        white-space: nowrap;
      }
      .wxc-daydelta {
        color: var(--muted);
        font-weight: 600;
      }
      .wxc-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 460px) {
        .wxc-grid {
          grid-template-columns: 1fr 1fr;
          align-items: stretch;
        }
      }
      .wxc-left {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .wxc-temp {
        font-size: 52px;
        font-weight: 800;
        line-height: 0.92;
        letter-spacing: -0.02em;
      }
      .wxc-feels {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0;
      }
      .wxc-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .wxc-m {
        background: var(--glass-2);
        border: 1px solid var(--border-2);
        border-radius: 15px;
        padding: 11px 13px;
        min-width: 0;
      }
      .wxc-m-l {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .wxc-m-v {
        font-size: 16px;
        font-weight: 700;
        margin-top: 3px;
      }
      /* Добово-нічний циферблат (self-contained; фон/тінь — інлайн за станом). */
      .wxc-dial {
        border-radius: 18px;
        padding: 16px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
      }
      .wxc-dial-svg {
        width: 100%;
        max-width: 260px;
        height: auto;
        display: block;
        margin: 0 auto;
        overflow: visible;
      }
      .wxc-dial-times {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 260px;
        margin: 0 auto;
      }
      .wxc-dial-times .rs {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .wxc-dial-times .ic {
        font-size: 15px;
      }
      .wxc-dial-times .v {
        font-size: 13.5px;
        font-weight: 800;
      }
      .wxc-dial-times .l {
        font-size: 10.5px;
        font-weight: 600;
        margin-top: 1px;
      }
      .wxc-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .wxc-chart-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
      }
      .wxc-chart-title {
        font-size: 14px;
        font-weight: 700;
      }
      .wxc-chart-mm {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }
      .wxc-chart-svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .wxc-foot {
        border-top: 1px solid var(--border-2);
        padding-top: 13px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .wxc-foot-row {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        font-size: 14px;
        color: var(--text);
        line-height: 1.4;
      }
      .wxc-foot-row .ic {
        font-size: 17px;
        line-height: 1.35;
        flex: none;
      }
      .wxc-foot-row b {
        font-weight: 700;
      }
      /* Кнопка «Вивчити» (питання дня) */
      .learn-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 9px 15px;
        border-radius: 10px;
        background: var(--grad, linear-gradient(90deg, #ff6b57, #ffb03a));
        color: var(--on-accent, #1a1206);
        font-weight: 600;
        font-size: 13px;
      }
      .wiki-open {
        font-size: 12px;
        white-space: nowrap;
        opacity: 0.85;
      }
      .saved-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .saved-del {
        flex: none;
        border: none;
        background: var(--glass-2);
        color: var(--muted);
        border-radius: 8px;
        width: 26px;
        height: 26px;
        font-size: 13px;
        cursor: pointer;
        line-height: 1;
      }
      .saved-del:hover {
        color: var(--fg, #fff);
      }
      .answer {
        margin-top: 8px;
        line-height: 1.5;
      }

      a {
        color: var(--text);
        text-decoration: none;
      }
      .item {
        display: block;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .item:first-of-type {
        border-top: 0;
      }

      /* ── Бейджі ─────────────────────────────────────────────────────────── */
      .badge {
        display: inline-block;
        border-radius: 20px;
        padding: 2px 9px;
        font-size: 12px;
        font-weight: 600;
        margin-right: 7px;
        white-space: nowrap;
      }
      .b-good {
        background: rgba(70, 224, 160, 0.16);
        color: var(--good);
      }
      .b-mid {
        background: var(--grad-soft);
        color: var(--accent-2);
      }
      .b-warn {
        background: rgba(255, 176, 58, 0.16);
        color: var(--warn);
      }
      .b-bad {
        background: rgba(255, 107, 134, 0.16);
        color: var(--bad);
      }
      .b-muted {
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }
      /* fit%-бейдж високого збігу — заливка градієнтом */
      .b-fit {
        background: var(--grad);
        color: var(--on-accent);
      }

      .why {
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.45;
        margin-top: 3px;
      }
      .muted {
        color: var(--muted);
      }
      .quote {
        font-size: 15.5px;
        font-style: italic;
        line-height: 1.5;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 26px;
      }
      .ph {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 14px;
        border: 1px dashed var(--border);
        border-radius: 12px;
      }

      /* ── Тап-toggle (делікатний афорданс, БЕЗ стрілок) ───────────────────── */
      .expandable {
        cursor: pointer;
        position: relative;
        transition: background 0.15s;
      }
      /* делікатний натяк: тонка «ручка» знизу картки/плитки, що клікабельна */
      .card > .expandable::after,
      .tile > .expandable::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -3px;
        transform: translateX(-50%);
        width: 26px;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
        opacity: 0.9;
        transition:
          width 0.15s,
          background 0.15s,
          opacity 0.15s;
        pointer-events: none;
      }
      .card > .expandable.expanded::after,
      .tile > .expandable.expanded::after {
        width: 34px;
        background: var(--grad);
        opacity: 0.85;
      }
      .exp-base {
        display: block;
      }
      .exp-more {
        display: none;
        margin-top: 12px;
      }
      .expandable.expanded > .exp-more {
        display: block;
      }
      /* swap: розширене ЗАМІНЮЄ базове (погода) */
      .expandable.swap.expanded > .exp-base {
        display: none;
      }
      .expandable.swap.expanded > .exp-more {
        display: block;
        margin-top: 0;
      }

      /* ── Новини ─────────────────────────────────────────────────────────── */
      /* заголовок теми з емодзі — більше «повітря» між категоріями */
      .cat {
        font-family: 'Golos Text', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: var(--accent-2);
        margin: 24px 0 6px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .cat:first-child {
        margin-top: 0;
      }
      /* блок теми: тонкий роздільник між категоріями (більше «повітря») */
      .news-topic {
        padding-top: 4px;
      }
      .news-topic + .news-topic,
      .expandable + .expandable {
        margin-top: 6px;
      }
      /* рядок однієї новини: текст + дії (голоси/збереження) справа. Більше повітря. */
      .news-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 14px;
      }
      .news-item:first-of-type {
        border-top: 0;
        padding-top: 4px;
        margin-top: 4px;
      }
      .exp-more .news-item {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 14px;
      }
      .exp-more .news-item:first-of-type {
        border-top: 1px solid var(--line);
      }
      .news-item .htext {
        flex: 1;
        min-width: 0;
        padding: 2px 0;
      }
      /* ВИРАЗНИЙ заголовок новини (Golos 15/500) — не дрібніший за кнопки */
      .news-item .htext .ntitle {
        display: block;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--text);
      }
      /* «чому» під заголовком — 13/muted */
      .news-item .htext .why {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.4;
        margin-top: 4px;
      }
      /* рівний ряд дій: ≥44px, з невеликим проміжком (не тісно) */
      .item-actions {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
      }
      .item-actions button {
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        font-size: 17px;
        line-height: 1;
        min-width: 44px;
        min-height: 44px;
        border-radius: 12px;
        opacity: 0.5;
        transition:
          opacity 0.15s,
          transform 0.12s,
          background 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .item-actions button:hover {
        background: var(--glass-2);
        opacity: 0.85;
      }
      /* ── ВИРАЗНА підсвітка обраної реакції — ЗАЛИТИЙ стан (переживає ре-рендер) ── */
      .item-actions button.on {
        opacity: 1;
      }
      .item-actions button.up.on {
        color: var(--on-accent);
        background: linear-gradient(135deg, #34d17f 0%, #46e0a0 100%);
        border-color: rgba(70, 224, 160, 0.6);
        box-shadow: 0 3px 12px rgba(70, 224, 160, 0.32);
      }
      .item-actions button.down.on {
        color: #fff;
        background: linear-gradient(135deg, #ff5470 0%, #ff6b86 100%);
        border-color: rgba(255, 107, 134, 0.6);
        box-shadow: 0 3px 12px rgba(255, 107, 134, 0.32);
      }
      /* 🔖 обраний — залите золоте */
      .item-actions button.save.on {
        color: var(--on-accent);
        background: var(--grad);
        border-color: rgba(255, 176, 58, 0.6);
        box-shadow: 0 3px 12px rgba(255, 122, 89, 0.32);
      }

      .more-btn {
        display: inline-block;
        margin: 12px 0 2px;
        padding: 9px 14px;
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--grad-soft);
        color: var(--accent-2);
        font-family: 'Golos Text', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      /* під-таби новин: 2 ВИРАЗНІ сегмент-кнопки Світ/Україна */
      .subnav {
        display: flex;
        gap: 6px;
        margin-bottom: 18px;
        padding: 5px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-2);
      }
      .subnav button {
        flex: 1;
        min-height: 46px;
        background: transparent;
        color: var(--muted);
        border: 0;
        border-radius: 11px;
        font-family: 'Golos Text', system-ui, sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.1px;
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s,
          box-shadow 0.15s;
      }
      .subnav button.active {
        color: var(--on-accent);
        font-weight: 700;
        background: var(--grad);
        box-shadow: 0 4px 14px rgba(255, 122, 89, 0.3);
      }

      /* ── Вакансії ───────────────────────────────────────────────────────── */
      .funnel {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .funnel .stage {
        flex: 1;
        background: var(--glass-2);
        border-radius: 13px;
        padding: 11px 4px;
        text-align: center;
        cursor: pointer;
        border: 1.5px solid var(--border-2);
        min-width: 0;
      }
      .funnel .stage.active {
        border-color: var(--accent);
      }
      /* панель деталей воронки — ПІД рядком стадій (не inline у вузькій комірці) */
      .funnel-detail {
        margin-top: 10px;
      }
      .funnel-detail:empty {
        display: none;
      }
      .funnel-detail-head {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .funnel .stage .n {
        font-family: 'Unbounded', 'Golos Text', sans-serif;
        font-size: 21px;
        font-weight: 700;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .funnel .stage .t {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-top: 2px;
      }
      /* розкритий список вакансій стадії */
      .stage-list {
        margin-top: 8px;
        text-align: left;
      }
      .stage-list .item {
        font-size: 13px;
        padding: 7px 0;
      }
      .stage-list .item a {
        color: var(--text);
      }
      /* D5: рядок деталей воронки — тайтл + контроли зміни стадії/видалення */
      .stage-detail-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stage-detail-item .fn-title {
        word-break: break-word;
      }
      .fn-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .fn-move,
      .fn-del {
        border: none;
        border-radius: 8px;
        background: var(--glass-2);
        color: var(--muted);
        font-size: 11px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .fn-move.on,
      .fn-move:disabled {
        background: var(--grad, linear-gradient(90deg, #ff6b57, #ffb03a));
        color: var(--on-accent, #1a1206);
        cursor: default;
      }
      .fn-del:hover {
        color: var(--fg, #fff);
      }
      /* домінантний тайтл вакансії (≥15–16, medium) */
      .job-title {
        display: block;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--text);
      }
      .job-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 12px;
      }
      /* кнопки-стадії ВТОРИННІ */
      .job-actions button {
        flex: 1 1 auto;
        min-height: 40px;
        min-width: 64px;
        border: 1px solid var(--border);
        background: var(--glass-2);
        color: var(--muted);
        border-radius: 11px;
        font-family: 'Golos Text', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        padding: 6px 8px;
      }
      .job-actions button.on {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--grad-soft);
        font-weight: 600;
      }
      .job-actions button[data-stage='irrelevant'].on {
        border-color: var(--bad);
        color: var(--bad);
        background: rgba(255, 107, 134, 0.12);
      }
      .job-card.hidden {
        display: none;
      }
      /* самооцінка mock-питання (Блок F) — той самий вторинний патерн, що job-actions */
      .mock-rate {
        display: flex;
        gap: 7px;
        margin-top: 10px;
      }
      .mock-rate .rate-btn {
        flex: 1 1 auto;
        min-height: 40px;
        border: 1px solid var(--border);
        background: var(--glass-2);
        color: var(--muted);
        border-radius: 11px;
        font-family: 'Golos Text', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        padding: 6px 8px;
      }
      .mock-rate .rate-btn.on {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--grad-soft);
        font-weight: 600;
      }
      .mock-rate .rate-btn:disabled {
        cursor: default;
      }

      /* ── Статистика ─────────────────────────────────────────────────────── */
      .streak-row {
        display: flex;
        gap: 10px;
      }
      .streak {
        flex: 1;
        background: var(--glass-2);
        border: 1px solid var(--border-2);
        border-radius: 13px;
        padding: 16px 12px 14px;
        text-align: center;
      }
      .streak .fire {
        font-size: 24px;
        line-height: 1;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: saturate(1.3);
      }
      .streak .n {
        font-family: 'Unbounded', 'Golos Text', sans-serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .streak .t {
        font-size: 11.5px;
        color: var(--muted);
      }
      .streak .rec {
        font-size: 11px;
        color: var(--accent-2);
        margin-top: 3px;
      }
      .weekbars {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 74px;
        margin-top: 12px;
      }
      .weekbars .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        height: 100%;
        justify-content: flex-end;
      }
      .weekbars .bar {
        width: 68%;
        background: var(--grad);
        border-radius: 5px 5px 0 0;
        min-height: 3px;
      }
      .weekbars .bar.off {
        background: var(--track);
      }
      .weekbars .d {
        font-size: 10px;
        color: var(--muted);
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
      }
      .bar-row .name {
        flex: 0 0 42%;
        font-size: 13px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-row .track {
        flex: 1;
        height: 8px;
        background: var(--track);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar-row .fill {
        height: 100%;
        background: var(--grad);
        border-radius: 4px;
      }
      .bar-row .val {
        flex: 0 0 auto;
        font-size: 12px;
        color: var(--muted);
        min-width: 34px;
        text-align: right;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        background: var(--glass-2);
        border: 1px solid var(--border-2);
        border-radius: 16px;
        padding: 6px 11px;
        font-size: 13px;
      }
      .chip .c {
        color: var(--accent-2);
        margin-left: 5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .statline {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        font-size: 13.5px;
      }
      .statline.first,
      .card > .statline:first-child {
        border-top: 0;
      }
      .statline .k {
        color: var(--muted);
      }
      .statline .v {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      /* прогрес до цілі */
      .goalbar {
        height: 12px;
        background: var(--track);
        border-radius: 6px;
        overflow: hidden;
        margin: 8px 0;
      }
      .goalbar .fill {
        height: 100%;
        background: var(--grad);
        border-radius: 6px;
      }

      /* дрібний підзаголовок усередині картки (розділи метрик) */
      .subhead {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-top: 14px;
        margin-bottom: 6px;
      }
      /* ── Теплокарта активності (GitHub-стиль): колонка = тиждень (Пн→Нд) ── */
      .heatmap {
        display: flex;
        gap: 3px;
        margin-top: 12px;
        justify-content: flex-start;
      }
      .hm-labels {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-right: 3px;
      }
      .hm-labels .l {
        height: 11px;
        font-size: 8.5px;
        line-height: 11px;
        color: var(--muted);
      }
      .hm-col {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .hm-c {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        /* порожня клітинка — той самий темований трек, що й бари/доріжки */
        background: var(--track);
      }
      .hm-c.l1 {
        background: rgba(255, 122, 89, 0.28);
      }
      .hm-c.l2 {
        background: rgba(255, 122, 89, 0.5);
      }
      .hm-c.l3 {
        background: rgba(255, 140, 70, 0.75);
      }
      .hm-c.l4 {
        background: linear-gradient(135deg, #ff6b57, #ffb03a);
      }
      /* гістограма — той самий каркас, що weekbars, + лічильник над стовпчиком */
      .weekbars .cnt {
        font-size: 10px;
        color: var(--muted);
      }
      .weekbars.hist {
        height: 88px;
      }
      /* рядок тренду: назва | спарклайн | значення */
      .bar-row .spark-cell {
        flex: 1;
        min-width: 0;
      }
      /* донат прогресу поруч із текстом */
      .donut-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }

      svg.spark {
        display: block;
        width: 100%;
        height: auto;
      }
      .delta-up {
        color: var(--good);
        font-weight: 600;
      }
      .delta-down {
        color: var(--bad);
        font-weight: 600;
      }
      .delta-flat {
        color: var(--link);
        font-weight: 600;
      }

      /* ══════════════════════════════════════════════════════════════════════
         СВІТЛА ТЕМА (prefers-color-scheme + .theme-light із Telegram)
         Скло/градієнт лишаються наші; база світлішає, текст темніє.
         ══════════════════════════════════════════════════════════════════════ */
      @media (prefers-color-scheme: light) {
        :root:not(.theme-dark) {
          --bg: #f3f1f6;
          --text: #1c2130;
          --muted: #5c6478;
          --glass: rgba(255, 255, 255, 0.55);
          --glass-2: rgba(255, 255, 255, 0.42);
          --glass-strong: rgba(255, 255, 255, 0.78);
          --border: rgba(20, 24, 40, 0.1);
          --border-2: rgba(20, 24, 40, 0.07);
          --line: rgba(20, 24, 40, 0.09);
          --track: rgba(20, 24, 40, 0.08);
          --shadow: 0 8px 26px rgba(60, 50, 80, 0.12);
          --on-accent: #241203;
          color-scheme: light;
        }
        :root:not(.theme-dark) body::before {
          background:
            radial-gradient(
              120% 60% at 80% -10%,
              rgba(255, 138, 92, 0.28) 0%,
              rgba(255, 190, 120, 0.14) 36%,
              rgba(255, 190, 120, 0) 64%
            ),
            radial-gradient(
              90% 48% at 6% 0%,
              rgba(150, 130, 255, 0.14) 0%,
              rgba(150, 130, 255, 0) 55%
            ),
            linear-gradient(180deg, #fbf6f2 0%, #f1eef5 52%, #ece9f2 100%);
        }
        :root:not(.theme-dark) .freshness {
          background: rgba(255, 255, 255, 0.7);
        }
        :root:not(.theme-dark) nav,
        :root:not(.theme-dark) .subnav {
          background: rgba(255, 255, 255, 0.5);
        }
      }
      /* Явна світла тема з Telegram (перекриває навіть у dark-OS) */
      :root.theme-light {
        --bg: #f3f1f6;
        --text: #1c2130;
        --muted: #5c6478;
        --glass: rgba(255, 255, 255, 0.55);
        --glass-2: rgba(255, 255, 255, 0.42);
        --glass-strong: rgba(255, 255, 255, 0.78);
        --border: rgba(20, 24, 40, 0.1);
        --border-2: rgba(20, 24, 40, 0.07);
        --line: rgba(20, 24, 40, 0.09);
        --track: rgba(20, 24, 40, 0.08);
        --shadow: 0 8px 26px rgba(60, 50, 80, 0.12);
        color-scheme: light;
      }
      :root.theme-light body::before {
        background:
          radial-gradient(
            120% 60% at 80% -10%,
            rgba(255, 138, 92, 0.28) 0%,
            rgba(255, 190, 120, 0.14) 36%,
            rgba(255, 190, 120, 0) 64%
          ),
          radial-gradient(
            90% 48% at 6% 0%,
            rgba(150, 130, 255, 0.14) 0%,
            rgba(150, 130, 255, 0) 55%
          ),
          linear-gradient(180deg, #fbf6f2 0%, #f1eef5 52%, #ece9f2 100%);
      }
      :root.theme-light .freshness {
        background: rgba(255, 255, 255, 0.7);
      }
      :root.theme-light nav,
      :root.theme-light .subnav {
        background: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="freshness" id="freshness">Завантаження…</div>
    <header>
      <h1>🌅 <span class="wm">Svitanok</span></h1>
      <div class="datenav">
        <button id="prevDay" aria-label="Попередній день">‹</button>
        <span class="when" id="when"></span>
        <button id="nextDay" aria-label="Наступний день">›</button>
      </div>
    </header>
    <nav id="nav"></nav>
    <section id="today" class="active"></section>
    <section id="news"></section>
    <section id="jobs"></section>
    <section id="stats"></section>

    <script>
      'use strict';
      /* ══════════════════════════════════════════════════════════════════════
         SVITANOK — дашборд v2 (пропозиція, редакція власника). Статичний,
         vanilla JS, без збірки. Рендер із briefing.json + /api/stats.
         Граційна деградація без нових полів/ендпойнтів (плейсхолдери).
         ══════════════════════════════════════════════════════════════════════ */

      /* ── Telegram bootstrap: базу синхронізуємо з themeParams, АКЦЕНТ лишаємо
         «Світанок» (не перезаписуємо градієнт/акценти). ────────────────────── */
      const tg = window.Telegram && window.Telegram.WebApp;
      // initData у заголовку для приватних GET-читань (briefing.json/stats/history).
      // Поза Telegram (немає initData) заголовок не шлеться -> сервер віддає 401,
      // і завантажувач деградує на SAMPLE (H1: дані власника не публічні).
      const authHeaders = () => (tg && tg.initData ? { 'X-Telegram-Init-Data': tg.initData } : {});
      function syncBase(p) {
        const root = document.documentElement;
        const set = (k, v) => v && root.style.setProperty(k, v);
        // Тему (світла/темна) визначаємо за colorScheme — керує CSS-класом.
        // Скло/градієнт/фон — НАШІ (не з themeParams), лише текст синхронізуємо.
        const scheme = tg && tg.colorScheme;
        if (scheme === 'light') {
          root.classList.add('theme-light');
          root.classList.remove('theme-dark');
        } else if (scheme === 'dark') {
          root.classList.add('theme-dark');
          root.classList.remove('theme-light');
        }
        // Текст/приглушений синхронізуємо з темою для читабельності;
        // --bg лишаємо нашому фону (body::before), тож НЕ чіпаємо базовий градієнт.
        set('--text', p.text_color);
        set('--muted', p.hint_color || p.subtitle_text_color);
        // --accent, --accent-2, --link, --grad, --glass* НЕ чіпаємо: бренд «Світанок» завжди.
      }
      if (tg) {
        tg.ready();
        tg.expand();
        syncBase(tg.themeParams || {});
        tg.onEvent && tg.onEvent('themeChanged', () => syncBase(tg.themeParams || {}));
        // Подія 'open' — раз на завантаження Mini App, тихо (trackClick сам no-op
        // без initData). Живить days.opens: стрік відкриттів, тижневу сітку і
        // «час до відкриття» (nowMin рахує Worker на своєму боці).
        trackClick('open', {});
      }

      /* ── Утиліти ─────────────────────────────────────────────────────────── */
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      const byId = (blocks, id) => (blocks || []).find((b) => b.id === id);
      const has = (v) => v !== undefined && v !== null && v !== '';
      const truncate = (s, n = 140) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
      // Стабільний детермінований id для обраного без url (факт/цитата/питання).
      const textHash = (s) => {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
        return (h >>> 0).toString(36);
      };
      // Пам'ять підсвітки 🔖 для факту/цитати/питання (kind:id → {saved:bool}).
      const ITEM_STATE = new Map();
      function saveItemBtn(kind, id, title) {
        const st = ITEM_STATE.get(kind + ':' + id) || {};
        const on = st.saved ? ' on' : '';
        const icon = st.saved ? '✅' : '🔖';
        return `<span class="item-actions" data-kind="${esc(kind)}" data-id="${esc(id)}" data-title="${esc(truncate(title))}">
          <button class="save${on}" data-act="save-item" aria-label="Зберегти">${icon}</button>
        </span>`;
      }
      const signTemp = (t) => (t > 0 ? '+' : '') + t + '°';
      const KYIV = 'Europe/Kyiv';

      const fmtClock = (unix) =>
        unix
          ? new Date(unix * 1000).toLocaleTimeString('uk-UA', {
              timeZone: KYIV,
              hour: '2-digit',
              minute: '2-digit',
            })
          : '—';
      const fmtDur = (min) => {
        const h = Math.floor(min / 60),
          m = min % 60;
        return h > 0 ? `${h} год ${m} хв` : `${m} хв`;
      };
      const dayLen = (a, b) => {
        if (!a || !b || b <= a) return '—';
        const m = Math.round((b - a) / 60);
        return `${Math.floor(m / 60)}г ${m % 60}хв`;
      };
      const haptic = (type) => {
        try {
          // HapticFeedback не всюди підтримується — м'яко ігноруємо
          if (tg && tg.HapticFeedback && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1'))
            tg.HapticFeedback.impactOccurred(type || 'light');
        } catch {}
      };
      // Заголовок з емодзі → без градієнт-«іскри» (емодзі вже несе акцент);
      // текстовий заголовок (Погода/Курс) → тонка «іскра» зліва.
      const leadsWithEmoji = (s) => /^\s*[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}]/u.test(s);
      const card = (title, inner, attrs = '', headerAction = '') => {
        const h3 = title
          ? `<h3${leadsWithEmoji(title) ? ' class="plain"' : ''}>${esc(title)}</h3>`
          : '';
        const head = headerAction ? `<div class="card-head">${h3}${headerAction}</div>` : h3;
        return `<div class="card" ${attrs}>${head}${inner}</div>`;
      };
      const ph = (txt) => `<div class="ph">${esc(txt)}</div>`;

      /* ══════════════════════════════════════════════════════════════════════
         ЄДИНИЙ ПАТЕРН ТАП-TOGGLE (делегування на body)
         .expandable > .exp-base (видно) + .exp-more (приховано). .swap → заміна.
         Кліки по a/button ігноруються тут (у них свої дії + stopPropagation).
         ══════════════════════════════════════════════════════════════════════ */
      // Афорданс делікатний (тонка «ручка» через CSS ::after), БЕЗ стрілок/chevron.
      const expandable = (inner, { swap = false, cls = '' } = {}) =>
        `<div class="expandable${swap ? ' swap' : ''}${cls ? ' ' + cls : ''}">${inner}</div>`;

      // ІЗОЛЯЦІЯ РОЗКРИТТЯ: closest() повертає САМЕ клікнутий (найглибший) .expandable,
      // toggle мутує ЛИШЕ його. Сусідні картки (курс/погода) мають кожна свій .expandable,
      // тож ніколи не співтоглять. CSS-селектори — прямі нащадки (> .exp-more), тож
      // розкриття одного контейнера НЕ показує вміст іншого/вкладеного.
      document.body.addEventListener('click', (e) => {
        if (e.target.closest('a, button')) return; // інтерактив має власну логіку
        const box = e.target.closest('.expandable');
        if (!box) return;
        e.stopPropagation(); // не даємо події «текти» до предків-expandable
        box.classList.toggle('expanded');
        haptic('light');
      });

      /* ══════════════════════════════════════════════════════════════════════
         SVG-ГРАФІКИ (самописні). Заливка/лінія — акцент «Світанок».
         ══════════════════════════════════════════════════════════════════════ */
      let GRAD_SEQ = 0; // унікальні id градієнтів у SVG
      function sparkline(values, opts = {}) {
        const w = opts.w || 280,
          h = opts.h || 56,
          pad = 4;
        const vals = (values || []).filter((v) => typeof v === 'number' && isFinite(v));
        if (vals.length < 2) return ph('Недостатньо даних для графіка');
        const min = Math.min(...vals),
          max = Math.max(...vals);
        const span = max - min || 1;
        const stepX = (w - pad * 2) / (vals.length - 1);
        const pts = vals.map((v, i) => [
          pad + i * stepX,
          pad + (h - pad * 2) * (1 - (v - min) / span),
        ]);
        const d = pts
          .map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1))
          .join(' ');
        const area = `${d} L${pts[pts.length - 1][0].toFixed(1)} ${h - pad} L${pts[0][0].toFixed(1)} ${h - pad} Z`;
        const last = pts[pts.length - 1];
        const gid = 'sg' + GRAD_SEQ++;
        // Градієнт лінії корал→амбер (фірмовий), заливка — приглушена версія.
        return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.label || 'графік')}">
          <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff6b57"/><stop offset="100%" stop-color="#ffb03a"/>
          </linearGradient></defs>
          <path d="${area}" fill="url(#${gid})" opacity="0.14" />
          <path d="${d}" fill="none" stroke="url(#${gid})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="#ffb03a" />
        </svg>`;
      }
      // Кільце прогресу (донат): r=15.9155 -> довжина кола = 100 (відсотки як dasharray).
      function donut(pct, opts = {}) {
        const p = Math.max(0, Math.min(100, Math.round(pct)));
        const gid = 'dn' + GRAD_SEQ++;
        const size = opts.size || 62;
        return `<svg viewBox="0 0 42 42" width="${size}" height="${size}" role="img" aria-label="${esc(opts.label || 'прогрес')}">
          <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff6b57"/><stop offset="100%" stop-color="#ffb03a"/>
          </linearGradient></defs>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="4.5"/>
          <circle cx="21" cy="21" r="15.9155" fill="none" stroke="url(#${gid})" stroke-width="4.5"
            stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="25" stroke-linecap="round"/>
          <text x="21" y="24.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text)">${p}%</text>
        </svg>`;
      }

      // Теплокарта активності: cells = [{d,v,l}] від понеділка (сервер вирівнює),
      // колонка = тиждень Пн→Нд, остання — частковий поточний тиждень.
      function heatmapGrid(cells) {
        if (!Array.isArray(cells) || !cells.length) return '';
        const cols = [];
        for (let i = 0; i < cells.length; i += 7) cols.push(cells.slice(i, i + 7));
        const colHtml = cols
          .map(
            (col) =>
              `<div class="hm-col">${col
                .map(
                  (c) => `<span class="hm-c l${c.l || 0}" title="${esc(c.d)}: ${c.v || 0}"></span>`,
                )
                .join('')}</div>`,
          )
          .join('');
        const labels = ['Пн', '', 'Ср', '', 'Пт', '', 'Нд']
          .map((t) => `<span class="l">${t}</span>`)
          .join('');
        return `<div class="heatmap" role="img" aria-label="теплокарта активності за 12 тижнів"><div class="hm-labels">${labels}</div>${colHtml}</div>`;
      }

      // Спільний каркас вертикальних барів (тижнева сітка + гістограма):
      // items = [{label, value}] — одна геометрія, щоб чарти не розїжджались.
      function barsChart(items, { showCount = false, cls = '' } = {}) {
        const max = Math.max(1, ...items.map((x) => x.value || 0));
        const cols = items
          .map((x) => {
            const off = !(x.value > 0);
            const hpct = Math.round(((x.value || 0) / max) * 100);
            const cnt = showCount ? `<div class="cnt">${x.value || ''}</div>` : '';
            return `<div class="col">${cnt}<div class="bar ${off ? 'off' : ''}" style="height:${off ? 3 : Math.max(6, hpct)}%"></div><div class="d">${esc(x.label)}</div></div>`;
          })
          .join('');
        return `<div class="weekbars${cls ? ' ' + cls : ''}">${cols}</div>`;
      }

      // Гістограма: bars = [{label, count}] — каркас barsChart + лічильник згори.
      function histogram(bars) {
        if (!Array.isArray(bars) || !bars.some((b) => (b.count || 0) > 0)) return '';
        return barsChart(
          bars.map((b) => ({ label: b.label, value: b.count || 0 })),
          { showCount: true, cls: 'hist' },
        );
      }

      function deltaBadge(curr, prev, digits = 2, unit = '') {
        if (!has(curr) || !has(prev)) return '';
        const dd = curr - prev;
        const cls = dd > 0 ? 'delta-up' : dd < 0 ? 'delta-down' : 'delta-flat';
        const arr = dd > 0 ? '↑' : dd < 0 ? '↓' : '→';
        return `<span class="${cls}">${arr} ${Math.abs(dd).toFixed(digits)}${unit}</span>`;
      }
      // Дуга сонця: півколо схід→захід + позиція сонця за поточним часом.
      function sunArc(sr, ss) {
        if (!has(sr) || !has(ss) || ss <= sr) return '';
        const now = Math.floor(Date.now() / 1000);
        const t = Math.max(0, Math.min(1, (now - sr) / (ss - sr)));
        const x = 12 + 96 * t;
        const y = 52 - Math.sin(Math.PI * t) * 42;
        return `<svg viewBox="0 0 120 64" width="100%" style="max-width:200px" role="img" aria-label="схід і захід сонця">
          <path d="M12 52 Q60 -18 108 52" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.55" />
          <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#ffb03a" />
          <text x="12" y="62" font-size="9" fill="var(--muted)" text-anchor="middle">🌅 ${fmtClock(sr)}</text>
          <text x="108" y="62" font-size="9" fill="var(--muted)" text-anchor="middle">🌇 ${fmtClock(ss)}</text>
        </svg>`;
      }

      /* ── Бейджі рівнів ───────────────────────────────────────────────────── */
      function uvBadge(uv) {
        if (!has(uv)) return '';
        let cls = 'b-good',
          txt = 'низький';
        if (uv >= 8) {
          cls = 'b-bad';
          txt = 'дуже високий';
        } else if (uv >= 6) {
          cls = 'b-warn';
          txt = 'високий';
        } else if (uv >= 3) {
          cls = 'b-mid';
          txt = 'помірний';
        }
        return `<span class="badge ${cls}">UV ${uv} · ${txt}</span>`;
      }
      function aqiBadge(aqi) {
        if (!has(aqi)) return '';
        const map = {
          1: ['b-good', 'добре'],
          2: ['b-good', 'прийнятно'],
          3: ['b-warn', 'помірно'],
          4: ['b-bad', 'погано'],
          5: ['b-bad', 'дуже погано'],
        };
        const [cls, txt] = map[aqi] || ['b-muted', '—'];
        return `<span class="badge ${cls}">AQI ${aqi} · ${txt}</span>`;
      }

      /* ══════════════════════════════════════════════════════════════════════
         ТАБ «СЬОГОДНІ»
         Порядок: Погода → Курс → Питання дня → Факт дня → Думка → У цей день
         (без підписів-груп Практичне/Розвиток/Натхнення)
         ══════════════════════════════════════════════════════════════════════ */
      // «У цей день»: скільки подій показано зараз (зростає на ONTHISDAY_STEP за
      // клік «Показати ще», доки не покаже всі з резерву). Скидається loadDay().
      let ONTHISDAY_SHOWN = 8;
      const ONTHISDAY_STEP = 2;

      function renderToday(blocks, stats) {
        const out = [];

        // 1) Погода — кожна локація окрема повноширинна клікабельна картка (ізольовано).
        const w = byId(blocks, 'weather');
        if (w?.data?.locations?.length)
          out.push(
            card('Погода', `<div class="rows">${w.data.locations.map(weatherTile).join('')}</div>`),
          );
        else out.push(card('Погода', ph('Дані про погоду з’являться в найближчому брифінгу')));

        // 2) Курс — ОДНА валюта в рядок (повноширинні рядки, кожен свій toggle-графік).
        out.push(currencyCard(byId(blocks, 'currency')?.data));

        // 3) Питання дня. Розкриття: відповідь + самооцінка (легко/важко) + «Вивчити».
        const mock = byId(blocks, 'mock');
        if (mock?.data) {
          const base = `<div class="exp-base">${esc(mock.data.question)}</div>`;
          const hint = has(mock.data.hint)
            ? `<div class="why">💡 ${esc(mock.data.hint)}</div>`
            : '';
          const answer = has(mock.data.answer)
            ? `<div class="answer">${esc(mock.data.answer)}</div>`
            : `<div class="muted">Відповідь з’явиться згодом. Спробуй відповісти вголос — тренування до співбесіди.</div>`;
          const rated = !!(stats && stats.mockRatedToday);
          const rateBtns = has(mock.data.answer)
            ? `<div class="mock-rate" data-topic="${esc(mock.data.topic || '')}">
                <button class="rate-btn${rated ? ' on' : ''}" type="button" data-act="mock-rate" data-rating="easy"${rated ? ' disabled' : ''}>😌 Легко</button>
                <button class="rate-btn${rated ? ' on' : ''}" type="button" data-act="mock-rate" data-rating="hard"${rated ? ' disabled' : ''}>😰 Важко</button>
              </div>`
            : '';
          const learn = has(mock.data.resourceUrl)
            ? `<a class="learn-btn" href="${esc(mock.data.resourceUrl)}" target="_blank" rel="noopener">📚 Вивчити</a>`
            : '';
          const more = `<div class="exp-more">${hint}${answer}${rateBtns}${learn}</div>`;
          const qId = textHash(mock.data.question);
          out.push(
            card(
              '🎤 Питання дня',
              expandable(base + more),
              '',
              saveItemBtn('question', qId, mock.data.question),
            ),
          );
        }

        // 4) Факт дня.
        const fact = byId(blocks, 'fact');
        if (fact?.data) {
          const fId = textHash(fact.data.fact);
          out.push(
            card('🧠 Факт дня', esc(fact.data.fact), '', saveItemBtn('fact', fId, fact.data.fact)),
          );
        }

        // 5) «Крок до офера» прибрано (D4): картка-ротація з фіксованого списку
        //    не давала користі; місце звільнено під майбутні фічі роадмепу v3.

        // 6) Думка дня.
        const stoic = byId(blocks, 'stoic');
        if (stoic?.data) {
          const quoteTitle = `«${stoic.data.text}» — ${stoic.data.author}`;
          const qtId = textHash(quoteTitle);
          out.push(
            card(
              '🏛 Думка дня',
              `<div class="quote">«${esc(stoic.data.text)}»</div><div class="muted" style="margin-top:8px">— ${esc(stoic.data.author)}</div>`,
              '',
              saveItemBtn('quote', qtId, quoteTitle),
            ),
          );
        }

        // 7) «У цей день»: показуємо 8 одразу, «Показати ще» додає по 2 з резерву.
        const onthis = byId(blocks, 'onthisday');
        if (onthis?.data?.events?.length) {
          const evs = onthis.data.events;
          // D3: якщо є посилання на статтю Вікіпедії — кнопка «Відкрити» (старі
          // briefing.json без url лишаються без кнопки, сумісно).
          const row = (e) => {
            const open = has(e.url)
              ? ` <a class="wiki-open" href="${esc(e.url)}" target="_blank" rel="noopener">Відкрити ↗</a>`
              : '';
            return `<div class="item"><b>${esc(e.year)}</b> — ${esc(e.text)}${open}</div>`;
          };
          const shown = Math.min(ONTHISDAY_SHOWN, evs.length);
          const remaining = evs.length - shown;
          const btn =
            remaining > 0
              ? `<button class="more-btn" type="button" data-act="onthisday-more">Показати ще (${Math.min(ONTHISDAY_STEP, remaining)})</button>`
              : '';
          out.push(card('📜 У цей день', evs.slice(0, shown).map(row).join('') + btn));
        }

        return out.join('');
      }

      // Добово-нічний ЦИФЕРБЛАТ (дизайн Sun/Moon Day-Night Dial). Коло 260×232:
      // верхня півкуля — день (схід→зеніт→захід), нижня — ніч (захід→надир→схід);
      // маркер їде повним колом за поточним часом. Стани день/ніч мають власні
      // палітри (self-contained «прилад неба»). Формули — з README (стилізовано:
      // полудень/північ рівно в середині фази). Повертає повну панель.
      const DIAL_DAY = {
        card: '#F1F2F6',
        shadow: '0 16px 36px -26px rgba(31,36,48,0.28)',
        progA: '#D2D5DE',
        progB: '#FF7A00',
        bezel: '#D8DBE4',
        hairline: '#F2F3F6',
        ticks: '#E3E5EC',
        horizon: '#E8D9BE',
        glossOp: 0.5,
        glow: '#FF9F1C',
        marker: '#FF7A00',
        timeText: '#1F2430',
        subText: '#B87400',
        rsVal: '#1F2430',
        rsLabel: '#8A90A2',
      };
      const DIAL_NIGHT = {
        card: '#20222E',
        shadow: '0 16px 36px -26px rgba(10,12,30,0.5)',
        progA: '#3A4380',
        progB: '#8C95C4',
        bezel: '#454E8A',
        hairline: '#242A52',
        ticks: '#333B6E',
        horizon: '#2A3163',
        glossOp: 0.1,
        glow: '#C9D2FF',
        marker: '#5B65A8',
        timeText: '#F2F3FF',
        subText: '#9AA6E8',
        rsVal: '#E7E9F7',
        rsLabel: '#8C95C4',
      };
      const DIAL_STARS = [
        [100, 150, 1.3, 0.9],
        [160, 145, 1.1, 0.8],
        [130, 185, 1.3, 0.85],
        [85, 175, 1.1, 0.75],
        [175, 170, 1.1, 0.8],
        [65, 140, 1, 0.6],
        [195, 140, 1, 0.6],
        [150, 122, 1, 0.65],
      ];

      function wxDial(sr, ss) {
        const nowSec = Date.now() / 1000;
        const valid = has(sr) && has(ss) && ss > sr;

        // Фаза + частка f у поточній фазі + наступна подія.
        let isDay = true,
          f = 0.5,
          nextEventSec = null,
          nextLabel = '';
        if (valid) {
          if (nowSec >= sr && nowSec <= ss) {
            isDay = true;
            f = (nowSec - sr) / (ss - sr);
            nextEventSec = ss;
            nextLabel = 'заходу';
          } else {
            isDay = false;
            if (nowSec < sr) {
              // Досвіток: учорашній захід (≈ss−24год) → сьогоднішній схід.
              const prevSunset = ss - 86400;
              f = (nowSec - prevSunset) / (sr - prevSunset);
              nextEventSec = sr;
            } else {
              // Після заходу: сьогоднішній захід → завтрашній схід (≈sr+24год).
              const nextSunrise = sr + 86400;
              f = (nowSec - ss) / (nextSunrise - ss);
              nextEventSec = nextSunrise;
            }
            nextLabel = 'сходу';
          }
        }
        f = Math.max(0, Math.min(1, f));

        // Кут (екранні координати, y вниз) і позиція маркера.
        const deg = (isDay ? 180 : 0) + 180 * f;
        const rad = (deg * Math.PI) / 180;
        const nowX = 130 + 84 * Math.cos(rad);
        const nowY = 110 + 84 * Math.sin(rad);
        const startX = isDay ? 46 : 214;
        const largeArc = 180 * f > 180 ? 1 : 0;

        const P = isDay ? DIAL_DAY : DIAL_NIGHT;
        const q = GRAD_SEQ++;

        // Зорі (нічна півкуля): вдень — груповий dim 0.55, вночі — власні opacity.
        const stars =
          DIAL_STARS.map(
            ([x, y, r, o]) =>
              `<circle cx="${x}" cy="${y}" r="${r}" fill="#B9C2F0" opacity="${o}" />`,
          ).join('') +
          // Зоря-«фіча» з ореолом.
          `<circle cx="115" cy="128" r="10" fill="#B9C2F0" opacity="0.12" /><circle cx="115" cy="128" r="1.3" fill="#E4E9FF" opacity="0.95" />`;

        // Кінцеві крапки: минула подія — нейтральна, майбутня — акцент+ореол.
        const upPt = isDay ? [214, 110] : [46, 110];
        const pastPt = isDay ? [46, 110] : [214, 110];
        const pastCol = isDay ? '#C9CDD8' : '#3A4380';
        const upCol = isDay ? '#FF9F1C' : '#FFD59A';
        const upHalo = isDay ? 0.25 : 0.3;
        const endDots = `<circle cx="${pastPt[0]}" cy="${pastPt[1]}" r="4" fill="${pastCol}" />
          <circle cx="${upPt[0]}" cy="${upPt[1]}" r="8" fill="${upCol}" opacity="${upHalo}" />
          <circle cx="${upPt[0]}" cy="${upPt[1]}" r="4.5" fill="${upCol}" />`;

        // Референс-іконки: Сонце в зеніті, Місяць-серп у надирі (активна — з ореолом).
        const sunIcon = isDay
          ? `<circle cx="130" cy="26" r="15" fill="url(#glow${q})" /><circle cx="130" cy="26" r="7" fill="#FFB020" />`
          : `<g opacity="0.35"><circle cx="130" cy="26" r="7" fill="#FFB020" /></g>`;
        const moonBase = `<circle cx="130" cy="194" r="9" fill="#E4E9FF" /><circle cx="134" cy="191" r="7.5" fill="#0D1128" />`;
        const moonIcon = isDay
          ? `<g opacity="0.4">${moonBase}</g>`
          : `<circle cx="130" cy="194" r="17" fill="url(#glow${q})" />${moonBase}`;

        // Маркер «зараз» + центральний зчитувач (у активній півкулі).
        const marker = `<circle cx="${nowX.toFixed(2)}" cy="${nowY.toFixed(2)}" r="11" fill="url(#glow${q})" /><circle cx="${nowX.toFixed(2)}" cy="${nowY.toFixed(2)}" r="5.5" fill="#FFFFFF" stroke="${P.marker}" stroke-width="2.5" />`;
        const cyTime = isDay ? 72 : 148;
        const sub = valid
          ? `до ${nextLabel} ${fmtDur(Math.max(0, Math.round((nextEventSec - nowSec) / 60)))}`
          : '';
        const readout = `<text x="130" y="${cyTime}" text-anchor="middle" font-size="26" font-weight="800" fill="${P.timeText}" style="letter-spacing:-0.01em">${fmtClock(nowSec)}</text>${sub ? `<text x="130" y="${cyTime + 16}" text-anchor="middle" font-size="11" font-weight="700" fill="${P.subText}">${esc(sub)}</text>` : ''}`;

        const aria = valid
          ? `Зараз ${isDay ? 'день' : 'ніч'}. Схід о ${fmtClock(sr)}, захід о ${fmtClock(ss)}. ${sub}`
          : 'Схід і захід сонця';

        const svg = `<svg class="wxc-dial-svg" viewBox="0 0 260 232" role="img" aria-label="${esc(aria)}">
          <defs>
            <clipPath id="ct${q}"><rect x="0" y="0" width="260" height="110" /></clipPath>
            <clipPath id="cb${q}"><rect x="0" y="110" width="260" height="122" /></clipPath>
            <clipPath id="cf${q}"><circle cx="130" cy="110" r="84" /></clipPath>
            <linearGradient id="domeD${q}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" /><stop offset="1" stop-color="#FFE3B8" /></linearGradient>
            <linearGradient id="domeN${q}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2140" /><stop offset="1" stop-color="#0D1128" /></linearGradient>
            <linearGradient id="prog${q}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${P.progA}" /><stop offset="1" stop-color="${P.progB}" /></linearGradient>
            <radialGradient id="gloss${q}" cx="0.32" cy="0.28" r="0.6"><stop offset="0" stop-color="#FFFFFF" stop-opacity="${P.glossOp}" /><stop offset="1" stop-color="#FFFFFF" stop-opacity="0" /></radialGradient>
            <radialGradient id="glow${q}" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="${P.glow}" stop-opacity="0.45" /><stop offset="1" stop-color="${P.glow}" stop-opacity="0" /></radialGradient>
          </defs>
          <circle cx="130" cy="110" r="84" fill="url(#domeD${q})" clip-path="url(#ct${q})" />
          <circle cx="130" cy="110" r="84" fill="url(#domeN${q})" clip-path="url(#cb${q})" />
          <g clip-path="url(#cf${q})" opacity="${isDay ? 0.55 : 1}">${stars}</g>
          <circle cx="130" cy="110" r="84" fill="url(#gloss${q})" clip-path="url(#cf${q})" />
          <circle cx="130" cy="110" r="84" fill="none" stroke="${P.bezel}" stroke-width="2" />
          <circle cx="130" cy="110" r="88" fill="none" stroke="${P.hairline}" stroke-width="1" />
          <g stroke="${P.ticks}" stroke-width="1.5" stroke-linecap="round">
            <line x1="190.81" y1="170.81" x2="195.76" y2="175.76" /><line x1="69.19" y1="170.81" x2="64.24" y2="175.76" />
            <line x1="69.19" y1="49.19" x2="64.24" y2="44.24" /><line x1="190.81" y1="49.19" x2="195.76" y2="44.24" />
          </g>
          <line x1="46" y1="110" x2="214" y2="110" stroke="${P.horizon}" stroke-width="1.5" />
          <path d="M ${startX},110 A 84,84 0 ${largeArc} 1 ${nowX.toFixed(2)},${nowY.toFixed(2)}" fill="none" stroke="url(#prog${q})" stroke-width="3" stroke-linecap="round" />
          ${endDots}
          ${sunIcon}
          ${moonIcon}
          ${marker}
          ${readout}
        </svg>`;

        return `<div class="wxc-dial" data-sr="${has(sr) ? sr : ''}" data-ss="${has(ss) ? ss : ''}" style="background:${P.card};box-shadow:${P.shadow}">
          ${svg}
          <div class="wxc-dial-times">
            <div class="rs"><span class="ic">🌅</span><div><div class="v" style="color:${P.rsVal}">${fmtClock(sr)}</div><div class="l" style="color:${P.rsLabel}">схід</div></div></div>
            <div class="rs"><div style="text-align:right"><div class="v" style="color:${P.rsVal}">${fmtClock(ss)}</div><div class="l" style="color:${P.rsLabel}">захід</div></div><span class="ic">🌇</span></div>
          </div>
        </div>`;
      }

      // Живий рух: переоновлюємо кожен циферблат на місці (маркер повзе, відлік
      // цокає, автоперехід день↔ніч). Дешево — SVG малий; тик раз на 30 с + при
      // поверненні фокуса на апку. data-sr/ss несуть ті самі схід/захід.
      function tickDials() {
        if (document.hidden) return;
        document.querySelectorAll('.wxc-dial[data-sr]').forEach((el) => {
          const sr = el.getAttribute('data-sr');
          const ss = el.getAttribute('data-ss');
          el.outerHTML = wxDial(sr ? +sr : undefined, ss ? +ss : undefined);
        });
      }
      setInterval(tickDials, 30000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) tickDials();
      });

      // Графік температури по годинах (дизайн): згладжена крива area+line, точки,
      // вісь Y (позначки °C + сітка), вісь годин, дощ-бенд. hourly = [{h,t}].
      // viewBox тягнеться на всю ширину контейнера (width:100%).
      function wxChart(hourly, rainWindow) {
        const W = 620,
          H = 150,
          xL = 34, // лівий відступ під підписи осі Y
          xR = 614,
          yTop = 18,
          yBot = 116;
        const pts = (hourly || []).filter((p) => p && typeof p.t === 'number' && isFinite(p.t));
        if (pts.length < 2) return ph('Недостатньо даних для графіка');
        const temps = pts.map((p) => p.t);
        const min = Math.min(...temps),
          max = Math.max(...temps),
          span = max - min || 1;
        // Вісь X — за РЕАЛЬНИМ діапазоном годин даних (крива на всю ширину, навіть
        // якщо ряд закінчується до 24:00). Години поза діапазоном — притиснуті.
        const hs = pts.map((p) => p.h);
        const hMin = Math.min(...hs),
          hMax = Math.max(...hs),
          hSpan = hMax - hMin || 1;
        const X = (h) => xL + ((Math.max(hMin, Math.min(hMax, h)) - hMin) / hSpan) * (xR - xL);
        const Y = (t) => yTop + (1 - (t - min) / span) * (yBot - yTop);
        const P = pts.map((p) => [X(p.h), Y(p.t)]);

        // Вісь Y: позначки max / середина / min + горизонтальні лінії сітки.
        const mid = Math.round((min + max) / 2);
        const marks = [...new Set([max, mid, min])];
        const yAxis = marks
          .map((v) => {
            const y = Y(v);
            return (
              `<line x1="${xL}" y1="${y.toFixed(1)}" x2="${xR}" y2="${y.toFixed(1)}" stroke="var(--border-2)" stroke-width="1" />` +
              `<text x="${xL - 7}" y="${(y + 3.6).toFixed(1)}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="end">${v}°</text>`
            );
          })
          .join('');

        // Згладжування через середини відрізків (control = попередня точка).
        let d = `M ${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
        for (let i = 1; i < P.length; i++) {
          const mx = (P[i - 1][0] + P[i][0]) / 2,
            my = (P[i - 1][1] + P[i][1]) / 2;
          d += ` Q ${P[i - 1][0].toFixed(1)} ${P[i - 1][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
        }
        d += ` L ${P[P.length - 1][0].toFixed(1)} ${P[P.length - 1][1].toFixed(1)}`;
        const area = `${d} L ${P[P.length - 1][0].toFixed(1)} ${yBot} L ${P[0][0].toFixed(1)} ${yBot} Z`;
        const gid = 'wxa' + GRAD_SEQ,
          lid = 'wxl' + GRAD_SEQ;
        GRAD_SEQ++;

        // Дощ-вікно (напр. «15:00–17:00»): ПУНКТИРНІ межі вікна + плаваюча пігулка
        // «☔ 15–17» під кривою (замість суцільної заливки — та «замулювалась»
        // під помаранчевим градієнтом area через z-order і кольоровий конфлікт).
        // Малюється ПІСЛЯ area+лінії — межі лишаються чіткими на будь-якій ділянці.
        let band = '';
        const m = has(rainWindow)
          ? String(rainWindow).match(/(\d{1,2}):\d{2}\D+(\d{1,2}):\d{2}/)
          : null;
        if (m) {
          const rx0 = X(+m[1]);
          const rx1 = X(+m[2]);
          const label = `☔ ${+m[1]}–${+m[2]}`;
          const pillW = Math.max(46, label.length * 6.6 + 16);
          const rcx = Math.max(xL + pillW / 2, Math.min(xR - pillW / 2, (rx0 + rx1) / 2));
          band = `<line x1="${rx0.toFixed(1)}" y1="${yTop}" x2="${rx0.toFixed(1)}" y2="${yBot}" stroke="#4c9bff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" />
            <line x1="${rx1.toFixed(1)}" y1="${yTop}" x2="${rx1.toFixed(1)}" y2="${yBot}" stroke="#4c9bff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" />
            <rect x="${(rcx - pillW / 2).toFixed(1)}" y="119" width="${pillW.toFixed(1)}" height="18" rx="9" fill="#4c9bff" opacity="0.18" />
            <text x="${rcx.toFixed(1)}" y="131.5" fill="#4c9bff" font-size="11" font-weight="700" text-anchor="middle">${label}</text>`;
        }
        // Маркери (кружечки) — лише на годинах з підписом осі (+ перша/остання
        // точка), а не на кожній. Лінія лишається повної роздільності (гладка),
        // але щільні майже-однакові ділянки (напр. рівна вранці) не «зливаються»
        // у пляму з маркерів — це саме те, що виглядало як точки, що «з'їжджають».
        const dotHours = new Set(pts.filter((p) => p.h % 3 === 0).map((p) => p.h));
        dotHours.add(pts[0].h);
        dotHours.add(pts[pts.length - 1].h);
        const dots = pts
          .map((p, i) => (dotHours.has(p.h) ? P[i] : null))
          .filter(Boolean)
          .map(
            (p) =>
              `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--bg)" stroke="var(--accent)" stroke-width="2" />`,
          )
          .join('');
        const ticks = pts
          .filter((p) => p.h % 3 === 0)
          .map(
            (p) =>
              `<text x="${X(p.h).toFixed(1)}" y="${H - 4}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="middle">${String(p.h).padStart(2, '0')}</text>`,
          )
          .join('');
        return `<svg class="wxc-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="температура по годинах">
          <defs>
            <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity="0.32" /><stop offset="1" stop-color="#ff8a3d" stop-opacity="0" /></linearGradient>
            <linearGradient id="${lid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb03a" /><stop offset="0.55" stop-color="#ff7a59" /><stop offset="1" stop-color="#ff6b86" /></linearGradient>
          </defs>
          ${yAxis}
          <path d="${area}" fill="url(#${gid})" />
          <path d="${d}" fill="none" stroke="url(#${lid})" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          ${band}
          ${dots}
          ${ticks}
        </svg>`;
      }

      // Погода: згорнутий рядок (temp+місто+стан), розкриття = дизайн Погода.dc.html.
      function weatherTile(l) {
        // exp-base (згорнуто): місто + велика темп зліва, стан + відч. справа.
        const base = `<div class="exp-base">
          <div class="wx-lead">
            <span class="wx-temp">${signTemp(l.tempC)}</span>
            <span class="wx-city">${esc(l.emoji || '')} ${esc(l.name)}</span>
            <span class="wx-cond">${esc(l.condition)}<br>відч. ${signTemp(l.feelsLikeC)}${l.willRain ? ` · ☔ ${l.popPercent}%` : ''}</span>
          </div>
        </div>`;

        // Пігулка довжини дня (+дельта vs учора).
        const delta =
          has(l.dayLenDeltaMin) && l.dayLenDeltaMin !== 0
            ? `<span class="wxc-daydelta">${l.dayLenDeltaMin > 0 ? '+' : '−'}${Math.abs(l.dayLenDeltaMin)} хв</span>`
            : '';
        const dl = dayLen(l.sunrise, l.sunset);
        const dayPill = dl ? `<div class="wxc-daypill">☀️ День ${dl} ${delta}</div>` : '';

        // Ліва зона: велика темп + 2×2 сітка метрик.
        const gust = has(l.gustMps) ? ` · пориви ${l.gustMps}` : '';
        const rainVal = has(l.rainWindow)
          ? esc(l.rainWindow)
          : l.willRain
            ? `${l.popPercent}%`
            : 'без опадів';
        const left = `<div class="wxc-left">
          <div class="wxc-temp">${signTemp(l.tempC)} <span class="wxc-feels">відч. ${signTemp(l.feelsLikeC)}</span></div>
          <div class="wxc-metrics">
            <div class="wxc-m"><div class="wxc-m-l">🌡 Мін / Макс</div><div class="wxc-m-v">${l.minC}° … ${l.maxC}°</div></div>
            <div class="wxc-m"><div class="wxc-m-l">💨 Вітер</div><div class="wxc-m-v">${l.windMps} м/с${gust}</div></div>
            <div class="wxc-m"><div class="wxc-m-l">💧 Вологість</div><div class="wxc-m-v">${has(l.humidity) ? l.humidity + '%' : '—'}</div></div>
            <div class="wxc-m"><div class="wxc-m-l">🌧 Опади</div><div class="wxc-m-v">${rainVal}</div></div>
          </div>
        </div>`;

        // Права зона: добово-нічний циферблат (self-contained панель).
        const sun = wxDial(l.sunrise, l.sunset);

        const badges = [uvBadge(l.uv), aqiBadge(l.aqi)].filter(Boolean).join('');
        const badgeRow = badges ? `<div class="wxc-badges">${badges}</div>` : '';

        const chart =
          Array.isArray(l.hourly) && l.hourly.length >= 2
            ? `<div>
                <div class="wxc-chart-head"><div class="wxc-chart-title">Температура по годинах</div></div>
                ${wxChart(l.hourly, l.rainWindow)}
              </div>`
            : '';

        const foot = has(l.advice)
          ? `<div class="wxc-foot"><div class="wxc-foot-row"><span class="ic">🧥</span><div><b>Порада:</b> ${esc(l.advice)}</div></div></div>`
          : '';

        const design = `<div class="wxc">
          <div class="wxc-head">
            <div class="wxc-place"><span class="wxc-emoji">${esc(l.emoji || '⛅')}</span><div><div class="wxc-city">${esc(l.name)}</div><div class="wxc-cond">${esc(l.condition)}</div></div></div>
            ${dayPill}
          </div>
          <div class="wxc-grid">${left}${sun}</div>
          ${badgeRow}
          ${chart}
          ${foot}
        </div>`;

        return `<div class="tile">${expandable(base + `<div class="exp-more">${design}</div>`, { swap: true })}</div>`;
      }

      // Курс: ОДНА валюта В РЯДОК (повноширинні рядки USD/EUR/PLN/GBP).
      // Тап розкриває спарклайн+дельту ВСЕРЕДИНІ лише цього рядка (ізольовано).
      function currencyCard(d) {
        if (!d) return card('Курс НБУ', ph('Курс валют недоступний'));
        const defs = [
          { key: 'usd', flag: '🇺🇸', label: 'USD', hk: 'usdHistory' },
          { key: 'eur', flag: '🇪🇺', label: 'EUR', hk: 'eurHistory' },
          { key: 'pln', flag: '🇵🇱', label: 'PLN', hk: 'plnHistory' },
          { key: 'gbp', flag: '🇬🇧', label: 'GBP', hk: 'gbpHistory' },
        ];
        const rows = defs
          .filter((c) => has(d[c.key]))
          .map((c) => {
            const hist = Array.isArray(d[c.hk]) ? d[c.hk] : null;
            const base = `<div class="exp-base">
              <div class="row-lead">
                <span class="lbl">${c.flag} ${c.label}</span>
                <span class="big">${esc(d[c.key])}</span>
              </div>
            </div>`;
            let more;
            if (hist && hist.length >= 2) {
              const prev = hist[hist.length - 2];
              more = `<div class="exp-more">
                <div class="sub">${deltaBadge(d[c.key], prev, 2, ' грн')} <span class="muted">за ${hist.length} дн.</span></div>
                ${sparkline(hist, { w: 480, h: 48, label: `${c.label} за ${hist.length} днів` })}
              </div>`;
            } else {
              more = `<div class="exp-more">${ph('Історія з’явиться згодом')}</div>`;
            }
            return `<div class="tile">${expandable(base + more)}</div>`;
          })
          .join('');
        return card(
          'Курс НБУ',
          rows ? `<div class="rows">${rows}</div>` : ph('Курс валют недоступний'),
        );
      }

      /* ══════════════════════════════════════════════════════════════════════
         ТАБ «НОВИНИ» — світові/укр × теми; 👍/👎/🔖 НА КОЖНОМУ АЙТЕМІ.
         ══════════════════════════════════════════════════════════════════════ */
      let NEWS_SCOPE = 'world';
      // Пам'ять підсвітки в межах сесії: key(url) → {vote:'up'|'down'|null, saved:bool}
      const NEWS_STATE = new Map();
      const nk = (url) => 'n:' + url;

      // Гідрувати 🔖 з /api/stats.savedList — переживає релоуд (на відміну від
      // NEWS_STATE/ITEM_STATE, які самі по собі лише сесійна пам'ять).
      function hydrateSaved(stats) {
        const list = stats && Array.isArray(stats.savedList) ? stats.savedList : [];
        for (const it of list) {
