          if (!it || !it.kind || !it.id) continue;
          if (it.kind === 'news') {
            const st = NEWS_STATE.get(nk(it.id)) || {};
            st.saved = true;
            NEWS_STATE.set(nk(it.id), st);
          } else {
            const st = ITEM_STATE.get(it.kind + ':' + it.id) || {};
            st.saved = true;
            ITEM_STATE.set(it.kind + ':' + it.id, st);
          }
        }
      }

      // Гідрувати підсвітку 👍/👎 з /api/stats.votes {url:'up'|'down'} (C3): без
      // цього після переоткриття Mini App кнопки виглядали б непроголосованими, і
      // повторний тап на сервері зняв би невидимо активний голос (знизивши вагу).
      function hydrateVotes(stats) {
        const votes = stats && stats.votes && typeof stats.votes === 'object' ? stats.votes : {};
        for (const [url, dir] of Object.entries(votes)) {
          if (dir !== 'up' && dir !== 'down') continue;
          const st = NEWS_STATE.get(nk(url)) || {};
          st.vote = dir;
          NEWS_STATE.set(nk(url), st);
        }
      }

      function renderNews(blocks) {
        const n = byId(blocks, 'news');
        if (!n?.data?.groups?.length) return '<div class="empty">Новин немає</div>';
        const groups = n.data.groups;
        const hasScope = groups.some((g) => g.scope === 'world' || g.scope === 'ua');

        if (!hasScope) return card('🗞 Новини', groups.map(newsTopicBlock).join(''));

        const active = groups.filter((g) => g.scope === (NEWS_SCOPE === 'ua' ? 'ua' : 'world'));
        const subnav = `<div class="subnav">
          <button data-scope="world" class="${NEWS_SCOPE === 'world' ? 'active' : ''}">🌍 Світ</button>
          <button data-scope="ua" class="${NEWS_SCOPE === 'ua' ? 'active' : ''}">🇺🇦 Україна</button>
        </div>`;
        const body = active.length
          ? active.map(newsTopicBlock).join('')
          : ph('У цій категорії поки порожньо');
        return card('🗞 Новини', subnav + `<div id="newsBody">${body}</div>`);
      }

      // Один рядок новини з per-item діями. category = тема (для /api/vote).
      function newsItem(it, topic) {
        const st = NEWS_STATE.get(nk(it.url)) || {};
        const upOn = st.vote === 'up' ? ' on' : '';
        const downOn = st.vote === 'down' ? ' on' : '';
        const saveOn = st.saved ? ' on' : '';
        const saveIcon = st.saved ? '✅' : '🔖';
        return `<div class="news-item">
          <a class="htext" href="${esc(it.url)}" target="_blank" rel="noopener"><span class="ntitle">${esc(it.title)}</span>${has(it.why) ? `<div class="why">${esc(it.why)}</div>` : ''}</a>
          <span class="item-actions" data-cat="${esc(topic)}" data-url="${esc(it.url)}" data-title="${esc(it.title)}">
            <button class="up${upOn}" data-dir="up" aria-label="Більше таких">👍</button>
            <button class="down${downOn}" data-dir="down" aria-label="Менше таких">👎</button>
            <button class="save${saveOn}" data-act="save" aria-label="Зберегти">${saveIcon}</button>
          </span>
        </div>`;
      }

      function newsTopicBlock(g) {
        const topic = g.topic || g.category || 'Інше';
        const head = `<div class="cat">${topicEmoji(topic)} ${esc(topic)}</div>`;
        const main = (g.items || []).map((it) => newsItem(it, topic)).join('');
        if (!g.more?.length) return `<div class="news-topic">${head}${main}</div>`;
        const more =
          `<div class="exp-more">${g.more.map((it) => newsItem(it, topic)).join('')}</div>` +
          `<button class="more-btn" type="button" data-toggle="1" data-label="Більше (${g.more.length})">Більше (${g.more.length})</button>`;
        return `<div class="expandable news-topic">${head}${main}${more}</div>`;
      }

      function topicEmoji(t) {
        const s = String(t).toLowerCase();
        if (/наук/.test(s)) return '🔬';
        if (/політ/.test(s)) return '🏛';
        if (/спорт/.test(s)) return '⚽';
        if (/війн|оборон|фронт/.test(s)) return '🛡';
        if (/техно|it|tech/.test(s)) return '💻';
        if (/економ|бізнес|фінанс/.test(s)) return '💹';
        if (/культур|мистецтв/.test(s)) return '🎭';
        if (/здоров|медиц/.test(s)) return '🩺';
        return '📰';
      }

      /* ══════════════════════════════════════════════════════════════════════
         ТАБ «ВАКАНСІЇ» — тапабельна воронка (розкриває список стадії) + картки.
         «Не релевантно» ефемерне: ховає картку на сьогодні, не в постійні списки.
         ══════════════════════════════════════════════════════════════════════ */
      const JOB_STAGES = [
        { key: 'saved', label: 'Збережено', short: 'Зберегти' },
        { key: 'applied', label: 'Подав', short: 'Подав' },
        { key: 'interview', label: 'Співбесіда', short: 'Співбесіда' },
        { key: 'offer', label: 'Офер', short: 'Офер' },
        { key: 'irrelevant', label: 'Не рел.', short: 'Не релевантно' },
      ];
      // ефемерно приховані сьогодні (не шлемо як стадію в постійний список)
      const HIDDEN_JOBS = new Set();
      // Жива мапа url→стадія з /api/stats (funnelList) — щоб стадії трималися після
      // перезавантаження (briefing.json — знімок о 08:00, тапи бувають пізніше).
      let JOB_STAGE_BY_URL = {};
      // Список вакансій по стадії (для панелі деталей воронки) + яка стадія зараз
      // розкрита (null = жодна). Тап по комірці перемикає; список — ПІД воронкою,
      // не всередині вузької комірки (розкриття inline ламало компактний рядок).
      let FUNNEL_BY_STAGE = {};
      let FUNNEL_ACTIVE_STAGE = null;

      function renderJobs(blocks, stats) {
        JOB_STAGE_BY_URL = {};
        const fl = stats && Array.isArray(stats.funnelList) ? stats.funnelList : null;
        if (fl) for (const e of fl) if (e && e.url && e.stage) JOB_STAGE_BY_URL[e.url] = e.stage;
        const j = byId(blocks, 'jobs');
        const out = [];
        out.push(funnelWidget(stats, j?.data?.items));
        if (!j?.data?.items?.length) {
          out.push('<div class="empty">Вакансій немає</div>');
          return out.join('');
        }
        out.push(j.data.items.map(jobCard).join(''));
        return out.join('');
      }

      // Воронка: 4 тапабельні стадії (без irrelevant). Тап розкриває список вакансій стадії.
      function funnelWidget(stats, items) {
        const fl = stats && Array.isArray(stats.funnelList) ? stats.funnelList : null;
        let f = stats && stats.funnel ? stats.funnel : null;
        if (!f && fl) {
          f = {};
          for (const e of fl) if (e.stage) f[e.stage] = (f[e.stage] || 0) + 1;
        }
        if (!f && Array.isArray(items)) {
          f = {};
          for (const it of items)
            if (it.funnelStage) f[it.funnelStage] = (f[it.funnelStage] || 0) + 1;
        }
        // Список вакансій за стадією для панелі деталей: з живого funnelList
        // (наскрізь по днях), фолбек — funnelStage поточних items (старий контракт).
        const byStage = {};
        if (fl) {
          for (const e of fl)
            if (e.stage)
              (byStage[e.stage] = byStage[e.stage] || []).push({
                url: e.url,
                title: e.title || '',
              });
        } else {
          (items || []).forEach((it) => {
            if (it.funnelStage) (byStage[it.funnelStage] = byStage[it.funnelStage] || []).push(it);
          });
        }
        FUNNEL_BY_STAGE = byStage;

        const cells = JOB_STAGES.filter((s) => s.key !== 'irrelevant')
          .map((s) => {
            const cnt = f && has(f[s.key]) ? f[s.key] : 0;
            const activeCls = FUNNEL_ACTIVE_STAGE === s.key ? ' active' : '';
            return `<div class="stage${activeCls}" data-stage="${s.key}">
              <span class="n">${cnt}</span><div class="t">${esc(s.label)}</div>
            </div>`;
          })
          .join('');
        const detail = FUNNEL_ACTIVE_STAGE ? funnelDetailHtml(FUNNEL_ACTIVE_STAGE) : '';
        return card(
          'Воронка',
          `<div class="funnel">${cells}</div><div class="funnel-detail">${detail}</div>`,
        );
      }

      // Людський заголовок вакансії (D5): назва, або hostname+шлях замість голого
      // URL (title буває порожній, якщо briefing зник до тапу по стадії).
      function prettyJobTitle(url, title) {
        if (title && title.trim()) return title.trim();
        try {
          const u = new URL(url);
          const path = u.pathname.replace(/\/+$/, '');
          return u.hostname.replace(/^www\./, '') + (path && path !== '/' ? path : '');
        } catch {
          return url || 'Вакансія';
        }
      }

      // Панель деталей воронки: список вакансій обраної стадії, ПІД рядком воронки.
      // D5: кожен рядок має кнопки зміни стадії (наприклад «подав» -> «офер») і ✕
      // (прибрати з воронки) — раніше стадію можна було міняти лише з картки дня,
      // а видалення = повторний клік активної стадії (неочевидно).
      function funnelDetailHtml(stageKey) {
        const label = JOB_STAGES.find((s) => s.key === stageKey)?.label || '';
        const list = FUNNEL_BY_STAGE[stageKey] || [];
        const moveStages = JOB_STAGES.filter((s) => s.key !== 'irrelevant');
        const listHtml = list.length
          ? list
              .map((it) => {
                const title = prettyJobTitle(it.url, it.title);
                const moves = moveStages
                  .map(
                    (s) =>
                      `<button class="fn-move${s.key === stageKey ? ' on' : ''}" data-act="funnel-move" data-url="${esc(it.url)}" data-title="${esc(title)}" data-stage="${s.key}"${s.key === stageKey ? ' disabled' : ''}>${esc(s.short)}</button>`,
                  )
                  .join('');
                return `<div class="item stage-detail-item">
                  <a class="fn-title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(title)}</a>
                  <div class="fn-controls">${moves}<button class="fn-del" data-act="funnel-del" data-url="${esc(it.url)}" aria-label="Прибрати з воронки">✕</button></div>
                </div>`;
              })
              .join('')
          : ph('Список цієї стадії з’явиться, коли будуть дані');
        return `<div class="funnel-detail-head">${esc(label)}</div><div class="stage-list">${listHtml}</div>`;
      }

      function jobCard(it) {
        const hidden = HIDDEN_JOBS.has(it.url) ? ' hidden' : '';
        let badge;
        if (it.score === -1 || it.score == null)
          badge = `<span class="badge b-muted">оцінюється</span>`;
        else if (it.score >= 80) badge = `<span class="badge b-fit">${it.score}% fit</span>`;
        else if (it.score >= 50) badge = `<span class="badge b-mid">${it.score}% fit</span>`;
        else badge = `<span class="badge b-warn">${it.score}% fit</span>`;

        // Тайтл ДОМІНУЄ (≥16/600); бейдж fit% — над тайтлом; кнопки-стадії вторинні.
        const title = `<a href="${esc(it.url)}" target="_blank" rel="noopener"><div style="margin-bottom:6px">${badge}</div><span class="job-title">${esc(it.title)}</span></a>`;
        const why = has(it.why)
          ? `<div class="exp-more"><div class="why">${esc(it.why)}</div></div>`
          : '';
        const curStage = JOB_STAGE_BY_URL[it.url] || it.funnelStage;
        // data-fit: щоб «Подав» з Mini App живив гістограму fit% так само, як
        // Telegram-кнопка «✅ Подав» (tg-core додає fit з callback). -1/відсутній
        // score («оцінюється») -> порожньо, подія піде без fit.
        const fitAttr = typeof it.score === 'number' && it.score >= 0 ? it.score : '';
        const btns = JOB_STAGES.map(
          (s) =>
            `<button class="${curStage === s.key ? 'on' : ''}" data-stage="${s.key}" data-url="${esc(it.url)}" data-title="${esc(it.title)}" data-fit="${fitAttr}">${esc(s.short)}</button>`,
        ).join('');
        const inner = `<div class="exp-base">${title}</div>${why}<div class="job-actions">${btns}</div>`;
        return `<div class="card job-card${hidden}" data-url="${esc(it.url)}"><div class="expandable">${inner}</div></div>`;
      }

      /* ══════════════════════════════════════════════════════════════════════
         ТАБ «СТАТИСТИКА» (без курсу). Блоки A–E.
         ══════════════════════════════════════════════════════════════════════ */
      function renderStats(stats) {
        if (!stats) {
          return (
            card('🔥 A · Звички', ph('Статистика з’явиться після кількох днів користування')) +
            card('🎯 B · Воронка та ціль', ph('Тут буде конверсія і прогрес до тижневої цілі')) +
            card('🎤 C · Майстерність', ph('Слабкі теми mock і роадмеп')) +
            card('❤️ D · Інтереси', ph('Топ-теми за твоїми 👍 та кліками')) +
            card('🛡 E · Надійність', ph('Стабільність доставки брифінгу'))
          );
        }
        const out = [];

        /* ── A · ЗВИЧКИ ── */
        const s = stats.streaks || {};
        const habits = `<div class="streak-row">
            <div class="streak"><div class="fire">🔥</div><div class="n">${has(s.openDays) ? s.openDays : 0}</div><div class="t">днів поспіль відкрито</div>${has(s.bestOpenDays) ? `<div class="rec">рекорд ${s.bestOpenDays}</div>` : ''}</div>
            <div class="streak"><div class="fire">🎤</div><div class="n">${has(s.mockDays) ? s.mockDays : 0}</div><div class="t">днів поспіль питання</div></div>
          </div>
          ${weekbars(stats.weekly)}
          ${
            Array.isArray(stats.heatmap) && stats.heatmap.some((c) => c.v > 0)
              ? `<div class="subhead">Активність · 12 тижнів</div>${heatmapGrid(stats.heatmap)}`
              : ''
          }
          ${has(stats.timeToOpenMin) ? `<div class="statline"><span class="k">Час до відкриття (медіана)</span><span class="v">+${stats.timeToOpenMin} хв після 08:00</span></div>` : ''}`;
        out.push(card('🔥 A · Звички', habits));

        /* ── B · ВОРОНКА + ЦІЛЬ ── */
        out.push(card('🎯 B · Воронка та ціль', funnelGoalBlock(stats)));

        /* ── C · МАЙСТЕРНІСТЬ ── */
        const mk = stats.mock || {};
        const rm = stats.roadmap;
        // A4: звʼязка mock↔roadmap — «тема тижня» (сідить наступний mock-батч)
        // і підказки «куди вчитись» для слабких тем.
        const mst = stats.mastery || {};
        const towRow = mst.themeOfWeek
          ? `<div class="statline first"><span class="k">🗓 Тема тижня</span><span class="v">${esc(mst.themeOfWeek.title)} · ${mst.themeOfWeek.done}/${mst.themeOfWeek.total}</span></div>`
          : '';
        const hintRows = Array.isArray(mst.hints)
          ? mst.hints
              .slice(0, 3)
              .map(
                (h) =>
                  `<div class="why">↳ ${esc(h.mockTopic)}: вчити ${(h.themes || []).map((t) => `${esc(t.title)} (${t.done}/${t.total})`).join(', ')}</div>`,
              )
              .join('')
          : '';
        const mastery = `${towRow}${barList(
          (mk.weakTopics || []).map((t) => ({ name: t.name, value: t.value })),
          '%',
          'Слабких тем поки не виявлено',
        )}${hintRows}
          ${has(mk.streak) ? `<div class="statline"><span class="k">Стрік mock</span><span class="v">🔥 ${mk.streak} дн.</span></div>` : ''}
          ${
            rm && has(rm.done) && has(rm.total)
              ? `<div class="donut-row">${donut((rm.done / Math.max(1, rm.total)) * 100, { label: 'прогрес роадмепу' })}<div><div style="font-weight:600">🗺 Роадмеп тем</div><div class="muted" style="font-size:13px">${rm.done}/${rm.total} підпунктів</div></div></div>`
              : `<div class="statline"><span class="k">🗺 Роадмеп тем</span><span class="v muted">скоро</span></div>`
          }`;
        out.push(card('🎤 C · Майстерність', mastery));

        /* ── D · ІНТЕРЕСИ ── */
        const interests = stats.interests || [];
        const savedKindIcon = { news: '📰', fact: '🧠', quote: '🏛', question: '🎤' };
        const savedRow = (x) => {
          const icon = savedKindIcon[x.kind] || '🔖';
          const label = esc(truncate(x.title || '', 80));
          const body =
            x.kind === 'news' && x.url
              ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${icon} ${label}</a>`
              : `<span>${icon} ${label}</span>`;
          // D2: ✕ прибирає збережене (unsave_news за url / unsave_item за kind+id).
          const data =
            x.kind === 'news' && x.url
              ? ` data-url="${esc(x.url)}"`
              : x.id
                ? ` data-id="${esc(x.id)}"`
                : '';
          const del = `<button class="saved-del" data-act="unsave" data-kind="${esc(x.kind)}"${data} aria-label="Прибрати зі збереженого">✕</button>`;
          return `<div class="item saved-item">${body}${del}</div>`;
        };
        const savedList = Array.isArray(stats.savedList) ? stats.savedList : [];
        // тренд топ-тем по тижнях: назва | спарклайн | сумарний бал
        const trend = stats.interestsTrend;
        const scoreBy = Object.fromEntries(interests.map((x) => [x.topic, x.score]));
        const trendRows =
          trend && Array.isArray(trend.topics)
            ? trend.topics
                .filter((t) => Array.isArray(t.series) && t.series.some((v) => v > 0))
                .slice(0, 5)
                .map(
                  (t) =>
                    `<div class="bar-row"><div class="name">${topicEmoji(t.topic)} ${esc(t.topic)}</div><div class="spark-cell">${sparkline(t.series, { w: 200, h: 22, label: `тренд ${t.topic}` })}</div><div class="val">${has(scoreBy[t.topic]) ? scoreBy[t.topic] : ''}</div></div>`,
                )
                .join('')
            : '';
        const dBlock = `${
          interests.length
            ? `<div class="chips">${interests.map((x) => `<span class="chip">${topicEmoji(x.topic)} ${esc(x.topic)}<span class="c">${x.score}</span></span>`).join('')}</div>`
            : ph('Лайкай новини — і тут з’являться твої теми')
        }
          ${trendRows ? `<div class="subhead">Тренд · 6 тижнів</div>${trendRows}` : ''}
          ${has(stats.readPerDay) ? `<div class="statline" style="margin-top:8px"><span class="k">Новин на день (середнє)</span><span class="v">${stats.readPerDay}</span></div>` : ''}
          ${
            has(stats.savedCount) && stats.savedCount > 0
              ? `<div class="statline" style="margin-top:8px"><span class="k">🔖 Ти зберіг</span><span class="v">${stats.savedCount}</span></div><div style="margin-top:4px">${savedList.map(savedRow).join('')}</div>`
              : ''
          }`;
        out.push(card('❤️ D · Інтереси', dBlock));

        /* ── E · НАДІЙНІСТЬ (міні-рядок) ── */
        // total>0 — лічильники живі (Worker пише їх з dead-man-перевірки о 10:00);
        // доти чесний плейсхолдер замість «0/0 днів».
        const r = stats.reliability;
        out.push(
          card(
            '🛡 E · Надійність',
            r && has(r.total) && r.total > 0
              ? `<div class="statline"><span class="k">Доставка вчасно</span><span class="v">${r.onTime}/${r.total} днів</span></div>${has(r.deadman) ? `<div class="statline"><span class="k">Dead-man спрацювань</span><span class="v">${r.deadman}</span></div>` : ''}`
              : ph('Дані про стабільність доставки з’являться згодом'),
          ),
        );

        return out.join('');
      }

      function funnelGoalBlock(stats) {
        const f = stats.funnel || {};
        const stages = JOB_STAGES.filter((s) => s.key !== 'irrelevant');
        const cells = stages
          .map(
            (s) =>
              `<div class="stage" style="cursor:default"><span class="n">${has(f[s.key]) ? f[s.key] : 0}</span><div class="t">${esc(s.label)}</div></div>`,
          )
          .join('');
        let html = `<div class="funnel">${cells}</div>`;

        // конверсія
        const c = stats.conversion || {};
        const conv = [];
        if (has(c.appliedToInterview))
          conv.push(
            `<div class="statline"><span class="k">Подав → співбесіда</span><span class="v">${c.appliedToInterview}%</span></div>`,
          );
        if (has(c.interviewToOffer))
          conv.push(
            `<div class="statline"><span class="k">Співбесіда → офер</span><span class="v">${c.interviewToOffer}%</span></div>`,
          );
        if (has(stats.avgFitApplied))
          conv.push(
            `<div class="statline"><span class="k">Середній fit% поданих</span><span class="v">${stats.avgFitApplied}%</span></div>`,
          );
        html += conv.join('');

        // ціль на тиждень
        const g = stats.goal;
        if (g && has(g.weeklyTarget)) {
          const applied = has(g.weeklyApplied) ? g.weeklyApplied : 0;
          const pct = Math.min(100, Math.round((applied / Math.max(1, g.weeklyTarget)) * 100));
          html += `<div class="statline"><span class="k">Тижневі відгуки (ціль)</span><span class="v">${applied} / ${g.weeklyTarget}</span></div>
            <div class="goalbar"><div class="fill" style="width:${pct}%"></div></div>`;
        }

        // темп подач за 8 тижнів (спарклайн; показуємо коли є хоч одна подача)
        const aw = stats.appliedWeekly;
        if (Array.isArray(aw) && aw.some((w) => w.count > 0)) {
          const total = aw.reduce((a, w) => a + (w.count || 0), 0);
          html += `<div class="subhead">Подачі · 8 тижнів (разом ${total})</div>
            ${sparkline(
              aw.map((w) => w.count || 0),
              { w: 480, h: 44, label: 'подачі по тижнях' },
            )}`;
        }

        // розподіл fit% поданих — на які вакансії реально подаюсь
        const fh = stats.fitHistogram;
        if (Array.isArray(fh) && fh.some((b) => b.count > 0)) {
          html += `<div class="subhead">Розподіл fit% поданих</div>${histogram(fh)}`;
        }
        return html;
      }

      function weekbars(weekly) {
        if (!Array.isArray(weekly) || !weekly.length) return ph('Немає даних за тиждень');
        return barsChart(weekly.map((d) => ({ label: d.day, value: d.value || 0 })));
      }

      function barList(arr, unit = '', emptyTxt = 'Поки порожньо') {
        if (!Array.isArray(arr) || !arr.length) return ph(emptyTxt);
        return arr
          .map(
            (x) =>
              `<div class="bar-row"><div class="name">${topicEmoji(x.name)} ${esc(x.name)}</div><div class="track"><div class="fill" style="width:${Math.max(0, Math.min(100, x.value))}%"></div></div><div class="val">${x.value}${unit}</div></div>`,
          )
          .join('');
      }

      /* ══════════════════════════════════════════════════════════════════════
         ДІЇ → бекенд (Telegram HMAC-auth)
         ══════════════════════════════════════════════════════════════════════ */
      function requireTelegram() {
        if (!tg || !tg.initData) {
          alert('Дія доступна лише при відкритті через Telegram.');
          return false;
        }
        return true;
      }

      // 👍/👎 → POST /api/vote {category(=тема), dir, url, initData}
      async function vote(btn, wrap) {
        if (!requireTelegram()) return;
        const dir = btn.dataset.dir;
        try {
          const r = await fetch('/api/vote', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              category: wrap.dataset.cat,
              dir,
              url: wrap.dataset.url,
              initData: tg.initData,
            }),
          });
          const dres = await r.json().catch(() => ({}));
          if (dres.ok) {
            tg.HapticFeedback?.notificationOccurred?.('success');
            // Підсвітку беремо з АВТОРИТЕТНОЇ відповіді сервера (C3): dres.voted =
            // 'up'|'down'|null — фактичний стан голосу після toggle/зміни. Раніше
            // клієнт вгадував toggle сам і розходився із сервером після переоткриття.
            const st = NEWS_STATE.get(nk(wrap.dataset.url)) || {};
            st.vote = dres.voted ?? null;
            NEWS_STATE.set(nk(wrap.dataset.url), st);
            wrap.querySelector('.up').classList.toggle('on', st.vote === 'up');
            wrap.querySelector('.down').classList.toggle('on', st.vote === 'down');
            refreshStats(); // D1 (інтереси)
          } else alert('Не вдалося зберегти оцінку.');
        } catch {
          alert('Немає зв’язку з сервером.');
        }
      }

      async function sendEvent(type, payload, onOk) {
        if (!requireTelegram()) return false;
        try {
          const r = await fetch('/api/event', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ type, ...payload, initData: tg.initData }),
          });
          const d = await r.json().catch(() => ({}));
          if (d.ok) {
            tg.HapticFeedback?.notificationOccurred?.('success');
            onOk && onOk(d);
            return true;
          }
          alert('Не вдалося зберегти дію.');
        } catch {
          alert('Немає зв’язку з сервером.');
        }
        return false;
      }

      // Пасивний трекінг (клік по заголовку новини) — мовчки, без alert на
      // помилку/поза Telegram: навігація за посиланням не має блокуватись.
      function trackClick(type, payload) {
        if (!tg || !tg.initData) return;
        fetch('/api/event', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ type, ...payload, initData: tg.initData }),
        }).catch(() => {});
      }

      // Навішування дій (делеговано на контейнери секцій — переживає ре-рендер).
      let ACTIONS_WIRED = false;
      function wireActions() {
        if (ACTIONS_WIRED) return;
        ACTIONS_WIRED = true;
        const newsEl = document.getElementById('news');
        const jobsEl = document.getElementById('jobs');

        // Новини: під-таби + голоси + збереження (per-item) + «Більше» + клік-трекінг.
        newsEl.addEventListener('click', (e) => {
          const sub = e.target.closest('.subnav button');
          if (sub) {
            e.stopPropagation();
            NEWS_SCOPE = sub.dataset.scope === 'ua' ? 'ua' : 'world';
            rerenderNews();
            haptic('light');
            return;
          }

          const link = e.target.closest('a.htext');
          if (link) {
            const actions = link.closest('.news-item')?.querySelector('.item-actions');
            if (actions)
              trackClick('news_click', { category: actions.dataset.cat, url: actions.dataset.url });
            return; // навігація за посиланням — не блокуємо
          }

          const voteBtn = e.target.closest('.item-actions button[data-dir]');
          if (voteBtn) {
            e.stopPropagation();
            vote(voteBtn, voteBtn.closest('.item-actions'));
            return;
          }

          const saveBtn = e.target.closest('.item-actions button[data-act="save"]');
          if (saveBtn) {
            e.stopPropagation();
            const wrap = saveBtn.closest('.item-actions');
            // D2: 🔖 — справжній тогл. Якщо вже збережено -> unsave_news.
            const willSave = !(NEWS_STATE.get(nk(wrap.dataset.url)) || {}).saved;
            sendEvent(
              willSave ? 'save_news' : 'unsave_news',
              { url: wrap.dataset.url, title: wrap.dataset.title, category: wrap.dataset.cat },
              () => {
                const st = NEWS_STATE.get(nk(wrap.dataset.url)) || {};
                st.saved = willSave;
                NEWS_STATE.set(nk(wrap.dataset.url), st);
                saveBtn.classList.toggle('on', willSave);
                saveBtn.textContent = willSave ? '✅' : '🔖';
                refreshStats(); // D1
              },
            );
            return;
          }

          const moreBtn = e.target.closest('.more-btn[data-toggle]');
          if (moreBtn) {
            e.stopPropagation();
            const box = moreBtn.closest('.expandable');
            if (box) {
              box.classList.toggle('expanded');
              moreBtn.textContent = box.classList.contains('expanded')
                ? 'Згорнути'
                : moreBtn.dataset.label || 'Більше';
            }
            return;
          }
        });

        // «Показати ще» подій + 🔖 на факт/цитату/питання у «Сьогодні».
        document.getElementById('today').addEventListener('click', (e) => {
          const saveBtn = e.target.closest('.item-actions button[data-act="save-item"]');
          if (saveBtn) {
            e.stopPropagation();
            const wrap = saveBtn.closest('.item-actions');
            const key = wrap.dataset.kind + ':' + wrap.dataset.id;
            // D2: справжній тогл (save_item <-> unsave_item).
            const willSave = !(ITEM_STATE.get(key) || {}).saved;
            sendEvent(
              willSave ? 'save_item' : 'unsave_item',
              { kind: wrap.dataset.kind, id: wrap.dataset.id, title: wrap.dataset.title },
              () => {
                const st = ITEM_STATE.get(key) || {};
                st.saved = willSave;
                ITEM_STATE.set(key, st);
                saveBtn.classList.toggle('on', willSave);
                saveBtn.textContent = willSave ? '✅' : '🔖';
                refreshStats(); // D1
              },
            );
            return;
          }

          const mockRateBtn = e.target.closest('[data-act="mock-rate"]');
          if (mockRateBtn) {
            e.stopPropagation();
            const wrap = mockRateBtn.closest('.mock-rate');
            sendEvent(
              'mock_answer',
              { topic: wrap?.dataset.topic || '', rating: mockRateBtn.dataset.rating },
              () => {
                wrap?.querySelectorAll('.rate-btn').forEach((b) => {
                  b.classList.add('on');
                  b.disabled = true;
                });
                refreshStats(); // D1 (слабкі теми mock)
              },
            );
            return;
          }

          const moreEvBtn = e.target.closest('[data-act="onthisday-more"]');
          if (moreEvBtn) {
            e.stopPropagation();
            ONTHISDAY_SHOWN += ONTHISDAY_STEP;
            document.getElementById('today').innerHTML = renderToday(CURRENT.blocks, CURRENT.stats);
            haptic('light');
          }
        });

        // Вакансії: тап по стадії воронки + дії на картці. «Не релевантно» ефемерне.
        jobsEl.addEventListener('click', (e) => {
          const stageCell = e.target.closest('.funnel .stage');
          if (stageCell) {
            e.stopPropagation();
            const key = stageCell.dataset.stage;
            FUNNEL_ACTIVE_STAGE = FUNNEL_ACTIVE_STAGE === key ? null : key;
            document.getElementById('jobs').innerHTML = renderJobs(CURRENT.blocks, CURRENT.stats);
            haptic('light');
            return;
          }

          // D5: перенести вакансію в іншу стадію просто зі списку деталей.
          const fnMove = e.target.closest('[data-act="funnel-move"]');
          if (fnMove) {
            e.stopPropagation();
            if (fnMove.disabled) return;
            sendEvent(
              'job_stage',
              { url: fnMove.dataset.url, title: fnMove.dataset.title, stage: fnMove.dataset.stage },
              () =>
                refreshStats().then(() => {
                  document.getElementById('jobs').innerHTML = renderJobs(
                    CURRENT.blocks,
                    CURRENT.stats,
                  );
                }),
            );
            return;
          }
          // D5: ✕ — прибрати вакансію з воронки (stage:null видаляє з funnel).
          const fnDel = e.target.closest('[data-act="funnel-del"]');
          if (fnDel) {
            e.stopPropagation();
            sendEvent('job_stage', { url: fnDel.dataset.url, stage: null }, () =>
              refreshStats().then(() => {
                document.getElementById('jobs').innerHTML = renderJobs(
                  CURRENT.blocks,
                  CURRENT.stats,
                );
              }),
            );
            return;
          }

          const btn = e.target.closest('.job-actions button');
          if (!btn) return;
          e.stopPropagation();
          const group = btn.parentElement;
          const active = btn.classList.contains('on');
          const stage = btn.dataset.stage;
          if (stage === 'irrelevant') {
            // ефемерно: ховаємо картку на сьогодні ЛИШЕ після успішного dismiss
            // (не потрапляє в постійні списки; скидається при новому брифінгу).
            const cardEl = btn.closest('.job-card');
            sendEvent('job_dismiss', { url: btn.dataset.url, title: btn.dataset.title }, () => {
              HIDDEN_JOBS.add(btn.dataset.url);
              if (cardEl) cardEl.classList.add('hidden');
            });
            return;
          }
          // Number('') === 0 — порожній data-fit не сміє стати fit:0
          const fit = btn.dataset.fit === '' ? NaN : Number(btn.dataset.fit);
          sendEvent(
            'job_stage',
            {
              url: btn.dataset.url,
              title: btn.dataset.title,
              stage: active ? null : stage,
              // fit лише при встановленні applied (recordEvent пише його в
              // fitApplied саме тоді); зняття стадії/інші стадії — без fit.
              ...(stage === 'applied' && !active && Number.isFinite(fit) && fit >= 0
                ? { fit }
                : {}),
            },
            () => {
              group.querySelectorAll('button').forEach((b) => b.classList.remove('on'));
              if (!active) {
                btn.classList.add('on');
                JOB_STAGE_BY_URL[btn.dataset.url] = stage;
              } else delete JOB_STAGE_BY_URL[btn.dataset.url];
              refreshStats(); // D1 (воронка)
            },
          );
        });

        // Статистика: видалення збереженого (D2). Делегований слухач на секції —
        // сама секція persist, тож refreshStats() re-render innerHTML не ламає його.
        document.getElementById('stats').addEventListener('click', (e) => {
          const del = e.target.closest('[data-act="unsave"]');
          if (!del) return;
          e.stopPropagation();
          const kind = del.dataset.kind;
          const isNews = kind === 'news';
          sendEvent(
            isNews ? 'unsave_news' : 'unsave_item',
            isNews ? { url: del.dataset.url } : { kind, id: del.dataset.id },
            () => {
              // Зняти підсвітку 🔖 у відповідній сесійній мапі, тоді перемалювати
              // і статистику, і контент-таб (ревʼю D: інакше вже відрендерена
              // кнопка 🔖 у «Новини»/«Сьогодні» лишалась би ✅ після видалення тут).
              if (isNews && del.dataset.url) {
                const st = NEWS_STATE.get(nk(del.dataset.url));
                if (st) st.saved = false;
                rerenderNews();
              } else if (del.dataset.id) {
                const st = ITEM_STATE.get(kind + ':' + del.dataset.id);
                if (st) st.saved = false;
                document.getElementById('today').innerHTML = renderToday(
                  CURRENT.blocks,
                  CURRENT.stats,
                );
              }
              refreshStats(); // D1
            },
          );
        });
      }

      /* ══════════════════════════════════════════════════════════════════════
         БАНЕР СВІЖОСТІ
         ══════════════════════════════════════════════════════════════════════ */
      function renderFreshness(generatedAt) {
        const el = document.getElementById('freshness');
        if (!generatedAt) {
          el.textContent = '';
          el.className = 'freshness';
          return;
        }
        const gen = new Date(generatedAt);
        const kyivDate = (d) => d.toLocaleDateString('uk-UA', { timeZone: KYIV });
        const isToday = kyivDate(gen) === kyivDate(new Date());
        const hhmm = gen.toLocaleTimeString('uk-UA', {
          timeZone: KYIV,
          hour: '2-digit',
          minute: '2-digit',
        });
        if (isToday) {
          el.className = 'freshness';
          el.textContent = `Оновлено сьогодні о ${hhmm} (Київ)`;
        } else {
          const dm = gen.toLocaleDateString('uk-UA', {
            timeZone: KYIV,
            day: '2-digit',
            month: '2-digit',
          });
          el.className = 'freshness stale';
          el.textContent = `⚠️ Дані від ${dm}`;
        }
      }

         ГОЛОВНИЙ РЕНДЕР + ТАБИ
         ══════════════════════════════════════════════════════════════════════ */
      const TABS = [
        ['today', 'Сьогодні'],
        ['news', 'Новини'],
        ['jobs', 'Вакансії'],
        ['stats', 'Статистика'],

      let CURRENT = { blocks: [], stats: null };

      function render(brief, stats) {
        CURRENT = { blocks: brief.blocks || [], stats: stats || null };
        ONTHISDAY_SHOWN = 8; // нове завантаження дня -> скинути розкриття
        hydrateSaved(CURRENT.stats);
        hydrateVotes(CURRENT.stats);
        renderFreshness(brief.generatedAt);
        document.getElementById('when').textContent = brief.dateLabel || '';
        document.getElementById('today').innerHTML = renderToday(CURRENT.blocks, CURRENT.stats);
        document.getElementById('news').innerHTML = renderNews(CURRENT.blocks);
        document.getElementById('jobs').innerHTML = renderJobs(CURRENT.blocks, CURRENT.stats);
        document.getElementById('stats').innerHTML = renderStats(CURRENT.stats);
        wireActions();

        const nav = document.getElementById('nav');
        if (!nav.dataset.wired) {
          nav.innerHTML = TABS.map(
            ([id, t], i) =>
              `<button data-t="${id}" class="${i === 0 ? 'active' : ''}">${t}</button>`,
          ).join('');
          nav.querySelectorAll('button').forEach((btn) =>
            btn.addEventListener('click', () => {
              nav.querySelectorAll('button').forEach((x) => x.classList.remove('active'));
              document.querySelectorAll('section').forEach((x) => x.classList.remove('active'));
              btn.classList.add('active');
              document.getElementById(btn.dataset.t).classList.add('active');
              haptic('light');
            }),
          );
          nav.dataset.wired = '1';
        }
      }

        document.getElementById('news').innerHTML = renderNews(CURRENT.blocks);

      // D1: після дії, що змінює статистику (збереження/оцінка/стадія/голос),
      // перечитати /api/stats і перемалювати таб «Статистика» — щоб цифри
      // (збережено, інтереси, воронка) оновлювались без ручного перезавантаження.
      // Делеговані слухачі висять на секціях (persist), тож re-render innerHTML
      // безпечний. Поза Telegram (fetchStats -> null) лишаємо як є.
      let statsRefreshing = false;
      async function refreshStats() {
        if (statsRefreshing) return;
        statsRefreshing = true;
        try {
          const s = await fetchStats();
          if (!s) return;
          CURRENT.stats = s;
          hydrateSaved(s);
          hydrateVotes(s);
          document.getElementById('stats').innerHTML = renderStats(s);
        } finally {
          statsRefreshing = false;
        }
      }

          const out = [];
          const d = new Date();
          d.setDate(d.getDate() - 83);

          const pattern = [

        if (idx !== 0) return null; // статистика лише для найновішого дня

          const r = await fetch('./api/stats', { cache: 'no-store', headers: authHeaders() });
          if (!r.ok) return null;
          return await r.json();
        } catch {
          return null;
        }
      }

      async function loadDay() {
        // при зміні дня скидаємо ефемерні приховування вакансій
        HIDDEN_JOBS.clear();
        const q = dates.length && dates[idx] ? `?date=${dates[idx]}` : '';
        let brief,
          stats = null;
        try {
          const r = await fetch(`./briefing.json${q}`, {
            cache: 'no-store',
            headers: authHeaders(),
          });
          if (!r.ok) throw new Error();
          brief = await r.json();
          stats = await fetchStats();
        } catch {
          brief = SAMPLE;
          stats = SAMPLE_STATS;
        }
        render(brief, stats);
        prevBtn.disabled = !dates.length || idx >= dates.length - 1;
        nextBtn.disabled = !dates.length || idx <= 0;
      }

      prevBtn.addEventListener('click', () => {
        if (idx < dates.length - 1) {
          idx++;
          loadDay();
        }
      });
      nextBtn.addEventListener('click', () => {
        if (idx > 0) {
          idx--;
          loadDay();
        }
      });

      fetch('./api/history', { headers: authHeaders() })
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((d) => {
          dates = Array.isArray(d.dates) ? d.dates : [];
        })
        .catch(() => {
          dates = [];
        })
        .finally(loadDay);
