name: brief

# Продакшн-джоба (§2, §4.3, §18). Cron у UTC; 08:00 Київ = 05:00 (літо) / 06:00
# (зима) UTC. Guard-ідемпотентність гарантує одну відправку на день.
on:
  # ТОЧНИЙ час дає Cloudflare-cron -> workflow_dispatch (без force -> нормальний
  # guard). GitHub-schedule лишається РЕЗЕРВОМ на випадок відмови CF: спрацьовує
  # пізно, але guard-ідемпотентність не дасть дубль. Обидва cron у UTC покривають
  # DST; guard-вікно [8,12) ловить типову затримку schedule.
  schedule:
    - cron: '0 5 * * *' # 08:00 Київ влітку (EEST = UTC+3)
    - cron: '0 6 * * *' # 08:00 Київ узимку (EET = UTC+2)
  workflow_dispatch: # CF-планувальник або ручний запуск
    inputs:
      force:
        description: 'Форсувати доставку (обійти вікно+ідемпотентність; для тестів)'
        type: boolean
        default: false

# Мінімальні права за замовчуванням (§8).
permissions: {}

# Ручний запуск під час scheduled не дає гонки; не скасовуємо поточний (§2).
concurrency:
  group: svitanok-brief
  cancel-in-progress: false

jobs:
  # Guard-гейт РАНО на системному node (без npm ci): дешево й не палить хвилини (§19.1).
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout приватного репо (лише код)
    outputs:
      send: ${{ steps.g.outputs.send }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Стан — із KV (ключ `state`), не з git-гілки. guard.mjs читає STATE_FILE;
      # якщо ключа нема (404) або збій — файл із JSON-помилкою/{} -> lastSentDate
      # null -> можливий дубль (прийнятно, at-least-once).
      - name: fetch state from KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: '389ff22c124a476bb18d2f5e6a5334c0' # namespace BRIEFING
        run: |
          CF_ACCOUNT_ID=$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          CF_API_TOKEN=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')
          curl -s -o "$RUNNER_TEMP/state.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/state" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" || echo '{}' > "$RUNNER_TEMP/state.json"
      - id: g
        env:
          STATE_FILE: ${{ runner.temp }}/state.json
        run: node scripts/guard.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

  brief:
    needs: guard
    if: needs.guard.outputs.send == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # стан у KV -> запис у репо не потрібен (least privilege)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # claude CLI потрібен модулю news (llm.ts: spawn 'claude -p'). Пін версії (§2.1, §8).
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.195
      # Неінтерактивність claude -p (§2.1): onboarding + ДОВІРА до теки.
      # Свіжий checkout не «довірений» -> діалог довіри -> claude -p exit 1.
      # hasTrustDialogAccepted per-project знімає це.
      - name: preseed claude non-interactive
        run: |
          cat > "$HOME/.claude.json" <<JSON
          {
            "hasCompletedOnboarding": true,
            "projects": {
              "${{ github.workspace }}": { "hasTrustDialogAccepted": true }
            }
          }
          JSON
      - name: run briefing
        env:
          # Стан у KV: orchestrator читає/пише namespace BRIEFING, ключ `state`.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: '389ff22c124a476bb18d2f5e6a5334c0'
          BRIEFING_FILE: ${{ github.workspace }}/briefing.json # дані для Mini App
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_BRIEFING: ${{ secrets.TOPIC_BRIEFING }} # опційно, Блок «Теми» (forum-супергрупа)
          TOPIC_ASSISTANT: ${{ secrets.TOPIC_ASSISTANT }} # опційно, Блок P2c (пропозиції співбесід)
          TOPIC_SYSTEM: ${{ secrets.TOPIC_SYSTEM }} # опційно, Фаза B (fail-notify окремо від контенту)
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }} # опційно, кнопка «Відкрити Mini App» у сповіщенні
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }} # опційно, Direct Link Mini App (initData з групи)
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: npx tsx src/orchestrator.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
      # Публікація briefing.json у Cloudflare KV -> дашборд показує живі дані
      # (Worker віддає /briefing.json із KV; без щоденного редеплою). Не валить ран.
      # Прямий виклик CF API замість wrangler: скоуплений токен ламає wrangler-
      # preflight (code 10015); PUT за явними account+namespace надійніший і швидший.
      - name: publish briefing to KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: '389ff22c124a476bb18d2f5e6a5334c0' # namespace BRIEFING (не секрет)
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "CF_API_TOKEN відсутній — пропуск"; exit 0; fi
          if [ ! -f "$GITHUB_WORKSPACE/briefing.json" ]; then echo "briefing.json немає — пропуск"; exit 0; fi
          # Захисне обрізання пробілів/переносів (секрет міг містити зайвий \r\n).
          CF_ACCOUNT_ID=$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          CF_API_TOKEN=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')
          code=$(curl -s -o /tmp/kv_resp.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/latest" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$GITHUB_WORKSPACE/briefing.json")
          echo "CF API HTTP $code"; cat /tmp/kv_resp.json; echo
          # Історія: копія під ключем briefing:<київська дата> для гортання в Mini App.
          if [ "$code" = "200" ]; then
            DAY=$(TZ=Europe/Kyiv date +%F)
            curl -s -o /dev/null -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/briefing:${DAY}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
              --data-binary @"$GITHUB_WORKSPACE/briefing.json" && echo "історія: briefing:${DAY} записано"
          fi
          if [ "$code" != "200" ]; then
            echo "KV-публікація не вдалася (не критично). Діагностика — акаунти токена:"
            curl -s "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              | jq -r '"token-success=" + (.success|tostring), (.result[]? | "ACCT " + .id + "  " + .name), (.errors[]? | "ERR " + (.code|tostring) + " " + .message)'
          fi
      # Стан оркестратор пише напряму в KV (ключ `state`) — окремий крок коміту не
      # потрібен. Гілка `state` лишилась незадіяною (можна видалити пізніше).
