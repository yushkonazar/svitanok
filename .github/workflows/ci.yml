name: CI

on:
  pull_request:
    branches: [develop, main]
    # ⚠️ `types` ЗАМІЩУЄ дефолтний набір, а не доповнює його — три перші тут
    # обовʼязкові, інакше звичайний PR лишиться без перевірок узагалі.
    #
    # `edited` доданий через реальний випадок: PR перецілили з однієї бази на
    # іншу, і жоден прогін не стартував — а старі галочки в інтерфейсі
    # виглядали як свіжі, тобто мовчання читалось як «перевірено».
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

# Мінімальні права за замовчуванням (§8); CI не пише в репо.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # `edited` прилітає і на правку заголовка чи опису — ганяти через це повний
    # прогін дарма. Пускаємо лише зміну БАЗИ: саме вона міняє те, з чим
    # порівнюється гілка. Умова написана так, що будь-яка помилка в ній
    # безпечна: `action != 'edited'` істинне для opened/synchronize/reopened і
    # для push, тож звичайний шлях не залежить від правої частини взагалі.
    if: github.event.action != 'edited' || github.event.changes.base != null
    # Точкове право (§8): checkout приватного репо потребує read,
    # інакше токен бачить 404 «Repository not found».
    permissions:
      contents: read
    steps:
      # Сторонні Actions пінено по commit SHA, не по тегу (§8).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # ⚠️ ГЕЙТ ПОКРИТТЯ, а не звіт для краси. Доти покриття не міряв ніхто:
      # інструмента не було в залежностях, прогону — в CI. Тобто число про
      # покриття неможливо було ні відтворити, ні захистити від регресу —
      # достатньо було видалити тест, і ніщо б не заперечило.
      # Пороги стоять нижче заміряного (88/82.9/89.2/89.4), щоб гейт ловив
      # провал, а не природне коливання. `npm test` окремо не потрібен —
      # test:coverage ганяє той самий сюїт.
      - run: npm run test:coverage
      # security-review (Anthropic) у CI — СВІДОМО НЕ РОБИМО (рішення власника,
      # 17.07.2026): він потребує платного API-ключа, а проєкт живе на Pro-підписці
      # через claude -p. Це не «колись додамо» — це закрите питання, тож і TODO тут
      # більше немає: інакше він щоразу спливав би як незакритий борг.
      # SPEC §10/§18 у частині security-review вважати нечинними.

  # React-дашборд (web/app, роадмеп v3 E) — окремий toolchain (Vite+React+TS+
  # Tailwind), власний package.json. Білд у CI ловить поломки міграції; артефакт
  # (web/public/app) не комітиться, збирається при деплої.
  #
  # Лінт і тести тут ОКРЕМІ від кореневих (аудит C2: «ESLint взагалі не покриває
  # web/app», «нуль компонентних тестів»). Кореневий vitest лишається для чистої
  # логіки — він швидкий і без DOM; сюди йде те, що можна перевірити лише
  # рендером (jsdom + Testing Library).
  dashboard:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited' || github.event.changes.base != null
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
