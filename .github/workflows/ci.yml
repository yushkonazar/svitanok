name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Мінімальні права за замовчуванням (§8); CI не пише в репо.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Сторонні Actions пінено по commit SHA, не по тегу (§8).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # TODO(security): додати security-review (Anthropic) як гейт, коли буде
      # доступний API-ключ у Secrets (§10, §18).
