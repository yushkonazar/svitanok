name: daily-content
on:
  schedule:
    - cron: '0 7 28-31 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Місяць YYYY-MM; порожньо — наступний місяць'
        type: string
        default: ''
permissions: {}
concurrency:
  group: svitanok-daily-content
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare and verify next monthly collection
        env:
          CONTENT_MONTH: ${{ inputs.month }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: '389ff22c124a476bb18d2f5e6a5334c0'
        run: npx tsx scripts/prepare-daily-content.mts
